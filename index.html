nt in students:\n    print(student[\"name\"], sum(student[\"marks\"]))","code":"students = [\n    {\"name\": \"Asha\", \"marks\": [80, 91]},\n    {\"name\": \"Ravi\", \"marks\": [72, 88]},\n]\nfor student in students:\n    print(student[\"name\"], sum(student[\"marks\"]))","explanation":"Nested collections let you model realistic data such as lists of records containing lists of values. Navigate one layer at a time.","mistakes":["Using Nested Collections mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Nested Collections. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Nested Collections?","options":["Combine lists and dictionaries for real-world data.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L3_6","level":3,"levelTitle":"Data Structures","order":6,"title":"Nested Collections"},{"objective":"Build collections concisely and clearly.","why":"You will use comprehensions when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build collections concisely and clearly. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Comprehensions\n\n# Write the smallest working example first.","code":"squares = [n * n for n in range(1, 6)]\nevens = [n for n in range(10) if n % 2 == 0]\nprint(squares)\nprint(evens)","explanation":"Comprehensions create collections from an iterable with an optional condition. Prefer them when the expression remains easy to read.","mista "Never test edge cases"],"answer":0}],"id":"L4_1","level":4,"levelTitle":"Functions","order":1,"title":"Function Basics"},{"objective":"Use positional, keyword, default, and variadic arguments.","why":"You will use parameters & arguments when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use positional, keyword, default, and variadic arguments. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def greet(name, message=\"Welcome\"):\n    return f\"{message}, {name}!\"\nprint(greet(\"Rohith\"))\nprint(greet(\"Rohith\", message=\"Good evening\"))","code":"def greet(name, message=\"Welcome\"):\n    return f\"{message}, {name}!\"\nprint(greet(\"Rohith\"))\nprint(greet(\"Rohith\", message=\"Good evening\"))","explanation":"Parameters are the function’s interface. Arguments provide actual values. Defaults make optional inputs convenient; keyword arguments make calls clearer.","mistakes":["Using Parameters & Arguments mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Parameters & Arguments. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Parameters & Arguments?","options":["Use positional, keyword, default, and variadic arguments.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L4_2","level":4,"levelTitle":"Functions","order":2,"title":"Parameters & Arguments"},{"objective":"Design functions that return useful results rather than printing everything.","why":"You will use return values when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Design functions that return useful results rather than printing everything. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Return Values\n\n# Write the smallest working example first.","code":"def is_even(number):\n    return number % 2 == 0\n\nresult = is_even(14)\nprint(result)","explanation":"Returning values keeps a function reusable. The caller decides what to do with the result.","mistakes":["Using Return Values mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Return Values. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Return Values?","options":["Design functions that return useful results rather than printing everything.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L4_3","level":4,"levelTitle":"Functions","order":3,"title":"Return Values"},{"objective":"Understand local, global, and enclosing names.","why":"You will use scope when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand local, global, and enclosing names. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"total = 10\n\ndef demo():\n    total = 25\n    return total\n\nprint(demo())\nprint(total)","code":"total = 10\n\ndef demo():\n    total = 25\n    return total\n\nprint(demo())\nprint(total)","explanation":"A local name can shadow xample so it solves a new problem related to Lambda & Functional Tools. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Lambda & Functional Tools?","options":["Use lambdas, map, filter, and sorted key functions appropriately.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L4_5","level":4,"levelTitle":"Functions","order":5,"title":"Lambda & Functional Tools"},{"objective":"Understand base cases and recursive calls.","why":"You will use recursion when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand base cases and recursive calls. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Recursion\n\n# Write the smallest working example first.","code":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))","explanation":"Recursion needs a base case and a step that moves toward the base case. Without those, calls never converge.","mistakes":["Using Recursion mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Recursion. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Recursion?","options":["Understand base cases and recursive calls.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L4_6","level":4,"levelTitle":"Functions","order":6,"title":"Recursion"},{"objective":"Write small, testable, single-purpose functions.","why":"You will use function design when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Write small, testable, single-purpose functions. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def normalize_name(text):\n    return \" \".join(text.strip().title().split())\n\nprint(normalize_name(\"  rohith   kumar \"))","code":"def normalize_name(text):\n    return \" \".join(text.strip().title().split())\n\nprint(normalize_name(\"  rohith   kumar \"))","explanation":"Good functions have one clear responsibility, explicit inputs, useful outputs, and predictable behavior. They are easier to test and reuse.","mistakes":["Using Function Design mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Function Design. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Function Design?","options":["Write small, testable, single-purpose functions.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L4_7","level":4,"levelTitle":"Functions","order":7,"title":"Function Design"},{"objective":"Build a reusable text analysis toolkit.","why":"You will use functions project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build a reusable text analysis toolkit. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def analyze(text):\n    words = text.split()\n    return {\"words\": len(words), \"chars\": len(text)}\n\nprint(analyze(\"Python makes automation practical\"))","code":"def analyze(text):\n    words = text.split()\n    return {\"words\": len(words), \"chars\": len(text)}\n\nprint(analyze(\"Python makes automation practical\"))","explanation":"Design a small toolkit as independent functions. Each function should accept data and return a result that another part can reuse.","mistakes":["Using Functions Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Functions Project. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Functions Project?","options":["Build a reusable text analysis toolkit.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L4_8","level":4,"levelTitle":"Functions","order":8,"title":"Functions Project"},{"objective":"Break larger problems into smaller solvable pieces.","why":"You will use problem decomposition when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Break larger problems into smaller solvable pieces. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def parse_scores(text):\n    return [int(x) for x in text.split()]\n\ndef average(values):\n    return sum(values) / len(values)\n\nscores = parse_scores(\"80 90 70\")\nprint(average(scores))","code":"def parse_scores(text):\n    return [int(x) for x in text.split()]\n\ndef average(values):\n    return sum(values) / len(values)\n\nscores = parse_scores(\"80 90 70\")\nprint(average(scores))","explanation":"Decomposition turns a vague task into named steps. Separate parsing, computation, and presentation so each piece can be tested independently.","mistakes":["Using Problem Decomposition mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Problem Decomposition. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Problem Decomposition?","options":["Break larger problems into smaller solvable pieces.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L5_1","level":5,"levelTitle":"Problem Solving & Algorithms","order":1,"title":"Problem Decomposition"},{"objective":"Estimate how algorithms scale.","why":"You will use time & space complexity when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Estimate how algorithms scale. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Time & Space Complexity\n\n# Write the smallest working example first.","code":"items = [10, 20, 30, 40]\n# Linear scan: O(n)\ntarget = 30\nfor value in items:\n    if value == target:\n        print(\"found\")\n        break","explanation":"Big-O describes growth as input size increases. A single full pass is typically O(n); repeatedly halving a search space leads to O(log n).","mistakes":["Using Time & Space Complexity mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Time & Space Complexity. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Time & Space Complexity?","options":["Estimate how algorithms scale.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L5_2","level":5,"levelTitle":"Problem Solving & Algorithms","order":2,"title":"Time & Space Complexity"},{"objective":"Search collections one item at a time and understand O(n).","why":"You will use linear search when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Search collections one item at a time and understand O(n). Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def linear_search(items, target):\n    for index, value in enumerate(items):\n        if value == target:\n            return index\n    return -1\n\nprint(linear_search([9, 4, 2, 8], 2))","code":"def linear_search(items, target):\n    for index, value in enumerate(items):\n        if value == target:\n            return index\n    return -1\n\nprint(linear_search([9, 4, 2, 8], 2))","explanation":"Linear search checks elements one by one and stops at the first match. Its worst-case time grows linearly with the collection size.","mistakes":["Using Linear Search mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing alization when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Store structured data in JSON. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# JSON & Serialization\n\n# Write the smallest working example first.","code":"import json\n\ndata = {\"name\": \"Rohith\", \"score\": 95}\ntext = json.dumps(data, indent=2)\nprint(text)\nprint(json.loads(text)[\"score\"])","explanation":"JSON maps common Python data structures to text so programs can save or exchange structured information.","mistakes":["Using JSON & Serialization mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to JSON & Serialization. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of JSON & Serialization?","options":["Store structured data in JSON.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L6_4","level":6,"levelTitle":"Intermediate Python","order":4,"title":"JSON & Serialization"},{"objective":"Work with datetime and common date calculations.","why":"You will use dates & time when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Work with datetime and common date calculations. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"from datetime import date, timedelta\n\ntoday = date.today()\nprint(today)\nprint(today + timedelta(days=7))","code":"from datetime import date, timedelta\n\ntoday = date.today()\nprint(today)\nprint(today + timedelta(days=7))","explanation":"datetime provides dedicated types for dates and times. Use timedelta for durations instead of manually adding numbers to calendar fields.","mistakes":["Using Dates & Time mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Dates & Time. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Dates & Time?","options":["Work with datetime and common date calculations.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L6_5","level":6,"levelTitle":"Intermediate Python","order":5,"title":"Dates & Time"},{"objective":"Understand lazy iteration and yield.","why":"You will use iterators & generators when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand lazy iteration and yield. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def squares(limit):\n    for n in range(limit):\n        yield n * n\n\nfor value in squares(4):\n    print(value)","code":"def squares(limit):\n    for n in range(limit):\n        yield n * n\n\nfor value in squares(4):\n    print(value)","explanation":"A generator yields one value at a time instead of building the entire result in memory. This is useful for large or streaming data.","mistakes":["Using Iterators & Generators mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Iterators & Generators. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Iterators & Generators?","options":["Understand lazy iteration and yield.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L6_6","level":6,"levelTitle":"Intermediate Python","order":6,"title":"Iterators & Generators"},{"objective":"Understand reusable behavior wrappers and resource management.","why":"You will use decorators & context managers when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand reusable behavior wrappers and resource management. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"from contextlib import contextmanager\n\n@contextmanager\ndef label(name):\n    print(\"start\", name)\n    try:\n        yield\n    finally:\n        print(\"end\", name)\n\nwith label(\"demo\"):\n    print(\"inside\")","code":"from contextlib import contextmanager\n\n@contextmanager\ndef label(name):\n    print(\"start\", name)\n    try:\n        yield\n    finally:\n        print(\"end\", name)\n\nwith label(\"demo\"):\n    print(\"inside\")","explanation":"Decorators wrap behavior around functions; context managers wrap setup and cleanup around a with block. Both help make resource-handling patterns reusable.","mistakes":["Using Decorators & Context Managers mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to D "id":"L7_1","level":7,"levelTitle":"Object-Oriented Python","order":1,"title":"Classes & Objects"},{"objective":"Initialize objects and manage instance state.","why":"You will use constructors & attributes when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Initialize objects and manage instance state. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Course:\n    def __init__(self, title, lessons):\n        self.title = title\n        self.lessons = lessons\n\ncourse = Course(\"Python\", 88)\nprint(course.title, course.lessons)","code":"class Course:\n    def __init__(self, title, lessons):\n        self.title = title\n        self.lessons = lessons\n\ncourse = Course(\"Python\", 88)\nprint(course.title, course.lessons)","explanation":"__init__ initializes each new object. Instance attributes store state specific to that object.","mistakes":["Using Constructors & Attributes mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Constructors & Attributes. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Constructors & Attributes?","options":["Initialize objects and manage instance state.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L7_2","level":7,"levelTitle":"Object-Oriented Python","order":2,"title":"Constructors & Attributes"},{"objective":"Design behavior around object responsibilities.","why":"You will use methods & encapsulation when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Design behavior around object responsibilities. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Counter:\n    def __init__(self):\n        self._value = 0\n\n    def increment(self):\n        self._value += 1\n\n    def value(self):\n        return self._value\n\nc = Counter(); c.increment(); print(c.value())","code":"class Counter:\n    def __init__(self):\n        self._value = 0\n\n    def increment(self):\n        self._value += 1\n\n    def value(self):\n        return self._value\n\nc = Counter(); c.increment(); print(c.value())","explanation":"Methods keep behavior close to the state it manages. A leading underscore communicates that an attribute is an internal implementation detail.","mistakes":["Using Methods & Encapsulation mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Methods & Encapsulation. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Methods & Encapsulation?","options":["Design behavior around object responsibilities.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L7_3","level":7,"levelTitle":"Object-Oriented Python","order":3,"title":"Methods & Encapsulation"},{"objective":"Reuse and specialize behavior through inheritance.","why":"You will use inheritance when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Reuse and specialize behavior through inheritance. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Animal:\n    def speak(self):\n        return \"sound\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"woof\"\n\nprint(Dog().speak())","code":"class Animal:\n    def speak(self):\n        return \"sound\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"woof\"\n\nprint(Dog().speak())","explanation":"Inheritance lets a subclass reuse and specialize a parent class. Use it when the relationship is genuinely “is-a”; otherwise composition is often clearer.","mistakes":["Using Inheritance mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Inheritance. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Inheritance?","options":["Reuse and specialize behavior through inheritance.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L7_4","level":7,"levelTitle":"Object-Oriented Python","order":4,"title":"Inheritance"},{"objective":"Write code that works with different object types.","why":"You will use polymorphism when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Write code that works with different object types. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Cat:\n    def speak(self): return \"meow\"\nclass Dog:\n    def speak(self): return \"woof\"\n\nfor animal in [Cat(), Dog()]:\n    print(animal.speak())","code":"class Cat:\n    def speak(self): return \"meow\"\nclass Dog:\n    def speak(self): return \"woof\"\n\nfor animal in [Cat(), Dog()]:\n    print(animal.speak())","explanation":"Polymorphism means different objects can respond to the same operation. Client code can depend on behavior rather than a specific concrete class.","mistakes":["Using Polymorphism mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Polymorphism. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Polymorphism?","options":["Write code that works with different object types.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L7_5","level":7,"levelTitle":"Object-Oriented Python","order":5,"title":"Polymorphism"},{"objective":"Represent data-focused objects cleanly.","why":"You will use dataclasses when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Represent data-focused objects cleanly. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Dataclasses\n\n# Write the smallest working example first.","code":"from dataclasses import dataclass\n\n@dataclass\nclass Product:\n    name: str\n    price: float\n\nitem = Product(\"Keyboard\", 999.0)\nprint(item)","explanation":"dataclasses reduce boilerplate for data-focused classes and provide useful generated methods such as __init__ and __repr__.","mistakes":["Using Dataclasses mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Dataclasses. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Dataclasses?","options":["Represent data-focused objects cleanly.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L7_6","level":7,"levelTitle":"Object-Oriented Python","order":6,"title":"Dataclasses"},{"objective":"Prefer clear object relationships over unnecessary inheritance.","why":"You will use composition & design when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Prefer clear object relationships over unnecessary inheritance. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Engine:\n    def start(self): return \"engine on\"\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine()\n\nprint(Car().engine.start())","code":"class Engine:\n    def start(self): return \"engine on\"\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine()\n\nprint(Car().engine.start())","explanation":"Composition models “has-a” relationships by assembling smaller objects. It often reduces coupling compared with deep inheritance hierarchies.","mistakes":["Using Composition & Design mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Composition & Design. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Composition & De esult","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L9_5","level":9,"levelTitle":"Real-World Python","order":5,"title":"HTTP & APIs"},{"objective":"Clean, aggregate, validate, and summarize tabular-like data.","why":"You will use data processing when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Clean, aggregate, validate, and summarize tabular-like data. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"rows = [{\"name\":\"Asha\", \"score\":\"90\"}, {\"name\":\"Ravi\", \"score\":\"75\"}]\nclean = [{\"name\":r[\"name\"], \"score\":int(r[\"score\"])} for r in rows if r[\"score\"].isdigit()]\nprint(sum(r[\"score\"] for r in clean) / len(clean))","code":"rows = [{\"name\":\"Asha\", \"score\":\"90\"}, {\"name\":\"Ravi\", \"score\":\"75\"}]\nclean = [{\"name\":r[\"name\"], \"score\":int(r[\"score\"])} for r in rows if r[\"score\"].isdigit()]\nprint(sum(r[\"score\"] for r in clean) / len(clean))","explanation":"Real data often arrives as text and may contain invalid rows. Clean, validate, transform, aggregate, then present the result.","mistakes":["Using Data Processing mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Data Processing. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Data Processing?","options":["Clean, aggregate, validate, and summarize tabular-like data.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L9_6","level":9,"levelTitle":"Real-World Python","order":6,"title":"Data Processing"},{"objective":"Organize a Python project for sharing and maintenance.","why":"You will use packaging & project structure when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Organize a Python project for sharing and maintenance. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"project = {\n    \"app/\": [\"__init__.py\", \"main.py\"],\n    \"tests/\": [\"test_main.py\"],\n    \"README.md\": \"usage + setup\",\n}\nfor path, items in project.items():\n    print(path, items)","code":"project = {\n    \"app/\": [\"__init__.py\", \"main.py\"],\n    \"tests/\": [\"test_main.py\"],\n    \"README.md\": \"usage + setup\",\n}\nfor path, items in project.items():\n    print(path, items)","explanation":"A maintainable project separates application code, tests, documentation, and configuration. Consistent structure makes onboarding and packaging easier.","mistakes":["Using Packaging & Project Structure mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Packaging & Project Structure. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Packaging & Project Structure?","options":["Organize a Python project for sharing and maintenance.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L9_7","level":9,"levelTitle":"Real-World Python","order":7,"title":"Packaging & Project Structure"},{"objective":"Build a production-s emorizing syntax.","syntax":"milestones = [\"requirements\", \"prototype\", \"tests\", \"release\"]\nfor i, milestone in enumerate(milestones, 1):\n    print(i, milestone)","code":"milestones = [\"requirements\", \"prototype\", \"tests\", \"release\"]\nfor i, milestone in enumerate(milestones, 1):\n    print(i, milestone)","explanation":"Plan around outcomes and milestones. Define the smallest useful version first, then add complexity only when it serves a clear requirement.","mistakes":["Using Project Planning mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Project Planning. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Project Planning?","options":["Turn requirements into milestones, interfaces, and testable outcomes.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_1","level":10,"levelTitle":"Professional Projects","order":1,"title":"Project Planning"},{"objective":"Use naming, small functions, documentation, and refactoring habits.","why":"You will use clean code when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use naming, small functions, documentation, and refactoring habits. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def calculate_total(prices):\n    \"\"\"Return the sum of non-negative prices.\"\"\"\n    return sum(price for price in prices if price >= 0)\n\nprint(calculate_total([100, 50, -1]))","code":"def calculate_total(prices):\n    \"\"\"Return the sum of non-negative prices.\"\"\"\n    return sum(price for price in prices if price >= 0)\n\nprint(calculate_total([100, 50, -1]))","explanation":"Clean code favors clear names, small functions, consistent conventions, and documentation where it reduces ambiguity.","mistakes":["Using Clean Code mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Clean Code. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Clean Code?","options":["Use naming, small functions, documentation, and refactoring habits.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_2","level":10,"levelTitle":"Professional Projects","order":2,"title":"Clean Code"},{"objective":"Separate UI, domain logic, data access, and utilities.","why":"You will use architecture basics when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Separate UI, domain logic, data access, and utilities. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def validate(value): return value.strip()\ndef save(value): print(\"SAVE\", value)\ndef run(raw):\n    value = validate(raw)\n    save(value)\n\nrun(\" task \")","code":"def validate(value): return value.strip()\ndef save(value): print(\"SAVE\", value)\ndef run(raw):\n    value = validate(raw)\n    save(value)\n\nrun(\" task \")","explanation":"Architecture separates responsibilities so changes remain local. Keep user interface, business rules, persistence, and utilities from becoming one large function.","mistakes":["Using Architecture Basics mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Architecture Basics. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Architecture Basics?","options":["Separate UI, domain logic, data access, and utilities.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_3","level":10,"levelTitle":"Professional Projects","order":3,"title":"Architecture Basics"},{"objective":"Combine unit, integration, edge-case, and regression testing.","why":"You will use testing strategy when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Combine unit, integration, edge-case, and regression testing. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def clamp(value, low, high):\n    return max(low, min(value, high))\n\nassert clamp(5, 0, 10) == 5\nassert clamp(-1, 0, 10) == 0\nassert clamp(99, 0, 10) == 10\nprint(\"tests passed\")","code":"def clamp(value, low, high):\n    return max(low, min(value, high))\n\nassert clamp(5, 0, 10) == 5\nassert clamp(-1, 0, 10) == 0\nassert clamp(99, 0, 10) == 10\nprint(\"tests passed\")","explanation":"A testing strategy covers normal behavior, boundaries, invalid data, and regressions. Edge cases often reveal more defects than happy-path tests alone.","mistakes":["Using Testing Strategy mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Testing Strategy. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Testing Strategy?","options":["Combine unit, integration, edge-case, and regression testing.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_4","level":10,"levelTitle":"Professional Projects","order":4,"title":"Testing Strategy"},{"objective":"Validate input, protect secrets, and avoid unsafe dynamic execution.","why":"You will use security basics when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Validate input, protect secrets, and avoid unsafe dynamic execution. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Security Basics\n\n# Write the smallest working example first.","code":"def safe_username(value):\n    value = value.strip()\n    if not value or len(value) > 30:\n        raise ValueError(\"Invalid username\")\n    return value\n\nprint(safe_username(\"Rohith\"))","explanation":"Treat input as untrusted. Validate data, avoid dynamic execution such as eval on user text, and keep secrets outside source code.","mistakes":["Using Security Basics mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Security Basics. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Security Basics?","options":["Validate input, protect secrets, and avoid unsafe dynamic execution.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_5","level":10,"levelTitle":"Professional Projects","order":5,"title":"Security Basics"},{"objective":"Use version control concepts and collaborative workflow habits.","why":"You will use git & collaboration when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use version control concepts and collaborative workflow habits. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"workflow = [\"branch\", \"change\", \"test\", \"commit\", \"review\", \"merge\"]\nprint(\" -> \".join(workflow))","code":"workflow = [\"branch\", \"change\", \"test\", \"commit\", \"review\", \"merge\"]\nprint(\" -> \".join(workflow))","explanation":"Version control gives you a history of changes and enables parallel work. Small focused commits and readable messages make collaboration easier.","mistakes":["Using Git & Collaboration mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Git & Collaboration. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Git & Collaboration?","options":["Use version control concepts and collaborative workflow habits.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_6","level":10,"levelTitle":"Professional Projects","order":6,"title":"Git & Collaboration"},{"objective":"Prepare configuration, dependencies, documentation, and releases.","why":"You will use deployment thinking when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Prepare configuration, dependencies, documentation, and releases. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"release = {\"version\":\"1.0.0\", \"tests\":\"pass\", \"docs\":\"ready\", \"config\":\"externalized\"}\nfor k,v in release.items(): print(k, v)","code":"release = {\"version\":\"1.0.0\", \"tests\":\"pass\", \"docs\":\"ready\", \"config\":\"externalized\"}\nfor k,v in release.items(): print(k, v)","explanation":"Deployment preparation includes reproducible setup, configuration handling, tests, documentation, and a clear release version.","mistakes":["Using Deployment Thinking mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Deployment Thinking. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Deployment Thinking?","options":["Prepare configuration, dependencies, documentation, and releases.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_7","level":10,"levelTitle":"Professional Projects","order":7,"title":"Deployment Thinking"},{"objective":"Plan and ship a complete Python portfolio project.","why":"You will use capstone portfolio when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Plan and ship a complete Python portfolio project. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Capstone Portfolio\n\n# Write the smallest working example first.","code":"# Capstone checklist\nproject = {\n    \"problem\": \"A real user problem\",\n    \"features\": [\"core feature\", \"validation\", \"persistence\"],\n    \"tests\": [\"happy path\", \"edge case\"],\n}\nprint(project)","explanation":"A portfolio project should demonstrate problem solving, readable code, validation, testing, documentation, and a clear user outcome—not just a large amount of code.","mistakes":["Using Capstone Portfolio mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Modify the example so it solves a new problem related to Capstone Portfolio. Add at least one edge case and explain your choice.","quiz":[{"q":"What is the main purpose of Capstone Portfolio?","options":["Plan and ship a complete Python portfolio project.","To replace every other Python feature","To make every program asynchronous","To avoid testing"],"answer":0},{"q":"What is a good learning habit?","options":["Change one thing and observe the result","Copy code without reading it","Ignore error messages","Never test edge cases"],"answer":0}],"id":"L10_8","level":10,"levelTitle":"Professional Projects","order":8,"title":"Capstone Portfolio"}];

const KEY='python_academy_complete_v1';
const DEFAULT={version:1,xp:0,streak:0,lastStudy:null,completedLessons:[],lessonPractice:{},practiceAwarded:{},quizResults:{},quizXpAwarded:{},completedChallenges:[],notes:{},bookmarks:[],recentLessons:[],labCode:'print("Hello, Python!")',labInput:''};
let state=loadState();
let currentLesson=null,currentChallenge=null,labRunning=false,worker=null,quizSelection={},quizScore={};
const navItems=[['dashboard','⌂','Dashboard'],['learn','▤','Learn'],['lab','⌘','Code Lab'],['challenges','✓','Challenges'],['profile','◉','Profile']];
function loadState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');const base=structuredClone(DEFAULT);const merged=Object.assign(base,raw);merged.version=1;merged.xp=Number.isFinite(Number(merged.xp))&&Number(merged.xp)>=0?Number(merged.xp):0;merged.streak=Number.isFinite(Number(merged.streak))&&Number(merged.streak)>=0?Math.floor(Number(merged.streak)):0;for(const k of ['completedLessons','completedChallenges','bookmarks','recentLessons']) if(!Array.isArray(merged[k])) merged[k]=[];for(const k of ['lessonPractice','practiceAwarded','quizResults','quizXpAwarded','notes']) if(!merged[k]||typeof merged[k]!=='object'||Array.isArray(merged[k])) merged[k]={};merged.labCode=typeof merged.labCode==='string'?merged.labCode:DEFAULT.labCode;merged.labInput=typeof merged.labInput==='string'?merged.labInput:'';return merged;}catch{return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); renderAll();}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function pct(a,b){return b?Math.round(a/b*100):0}
function lessonById(id){return LESSONS.find(x=>x.id===id)}
function nextLessonFor(id){const idx=LESSONS.findIndex(x=>x.id===id); return LESSONS[idx+1]||null}
function firstIncomplete(){return LESSONS.find(x=>!state.completedLessons.includes(x.id))||LESSONS[LESSONS.length-1]}
function levelProgress(level){const ls=LESSONS.filter(x=>x.level===level); return {done:ls.filter(x=>state.completedLessons.includes(x.id)).length,total:ls.length}}
function levelUnlocked(level){if(level===0)return true; const p=levelProgress(level-1); return p.done===p.total}
function localDateKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function recordActivity(){const today=localDateKey(); if(state.lastStudy===today)return; if(state.lastStudy){const prev=new Date(`${state.lastStudy}T00:00:00`), now=new Date(`${today}T00:00:00`); const diff=Math.round((now-prev)/86400000); state.streak=diff===1?Math.max(1,state.streak)+1:1;}else{state.streak=1;} state.lastStudy=today; localStorage.setItem(KEY,JSON.stringify(state));}
function go(view, extra=''){location.hash=extra?`#${view}/${extra}`:`#${view}`;}
function parseRoute(){const [v,id]=(location.hash.replace(/^#/,'')||'dashboard').split('/'); return {view:['dashboard','learn','lesson','lab','challenges','profile','search'].includes(v)?v:'dashboard',id}}
function navRender(){for(const id of ['sideNav','mobileNav']){const el=document.getElementById(id); el.innerHTML=navItems.map(([k,ic,t])=>`<button data-view="${k}" class="${parseRoute().view===k?'active':''}"><span>${ic}</span>${t}</button>`).join(''); el.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.view));}}
function renderAll(){recordActivity(); const r=parseRoute(); document.querySelectorAll('.view').forEach(x=>x.classList.remove('active')); document.getElementById('view-'+r.view).classList.add('active'); navRender(); document.getElementById('pageTitle').textContent={dashboard:'Dashboard',learn:'Curriculum',lesson:'Lesson',lab:'Code Lab',challenges:'Challenges',profile:'Profile',search:'Search'}[r.view]; renderDashboard();renderLearn();renderLesson(r.id);renderLab();renderChallenges();renderProfile();renderSearch();}
function renderDashboard(){const done=state.completedLessons.length,total=LESSONS.length,ch=state.completedChallenges.length; const next=firstIncomplete(); document.getElementById('view-dashboard').innerHTML=`
<div class="hero"><div class="eyebrow">Your Python journey</div><h2>Build Python skills that stay with you.</h2><p>Learn the idea, see it in code, predict what happens, practice it, and prove mastery. No account. No cloud sync. Everything here is stored locally.</p><div class="toolbar"><button class="primary" onclick="go('lesson','${next.id}')">${done?'Continue learning':'Start learning'} →</button><button class="ghost" onclick="go('lab')">Open Code Lab</button></div></div>
<div class="stats"><div class="stat"><div class="n">${state.xp}</div><div class="l">XP earned</div></div><div class="stat"><div class="n">${state.streak} 🔥</div><div class="l">Study streak</div></div><div class="stat"><div class="n">${done} / ${total}</div><div class="l">Lessons mastered</div></div><div class="stat"><div class="n">${ch} / ${CHALLENGES.length}</div><div class="l">Challenges solved</div></div></div>
<div class="grid grid-2"><div class="card"><div class="eyebrow">Course progress</div><h3>${pct(done,total)}% complete</h3><div class="progress"><span style="width:${pct(done,total)}%"></span></div><p>Level ${Math.min(10,Math.floor(done/8))} of 10. Finish all lessons in a level to unlock the next one.</p></div><div class="card"><div class="eyebrow">Today</div><h3>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</h3><p>Keep the session focused: read one lesson, run one experiment, and complete one mastery check.</p></div></div>
<div class="card" style="margin-top:16px"><div class="eyebrow">Quick access</div><div class="grid grid-3" style="margin-top:12px"><button class="ghost" onclick="go('learn')">Browse roadmap</button><button class="ghost" onclick="go('challenges')">Practice challenges</button><button class="ghost" onclick="go('profile')">Review progress</button></div></div>`}
function renderLearn(){const box=document.getElementById('view-learn'); box.innerHTML=`<div class="hero"><div class="eyebrow">Curriculum roadmap</div><h2>From first print to professional projects.</h2><p>${LESSONS.length} lessons across 11 levels. Every level ends with a practical challenge and a project direction.</p></div>`+CURRICULUM.map(l=>{const p=levelProgress(+l.id), unlocked=levelUnlocked(+l.id); return `<div class="card ${unlocked?'':'lock'}" style="margin-bottom:12px"><div class="level-card"><div class="level-num">${l.id}</div><div><h3>Level ${l.id} · ${esc(l.title)}</h3><div class="progress"><span style="width:${pct(p.done,p.total)}%"></span></div><div class="muted" style="font-size:12px;margin-top:6px">${p.done} / ${p.total} mastered ${unlocked?'':' · Locked until previous level is complete'}</div></div><button class="ghost" ${unlocked?'':'disabled'} onclick="go('lesson','${l.lessons.find(x=>!state.completedLessons.includes(x.id))?.id||l.lessons[0].id}')">Open</button></div><div class="lesson-list">${l.lessons.map((x,i)=>{const d=state.completedLessons.includes(x.id); return `<div class="lesson-row ${d?'done':''}"><div class="check">${d?'✓':i+1}</div><button ${unlocked?`onclick="go('lesson','${x.id}')"`:'disabled title="Finish the previous level first"'}><strong>${esc(x.title)}</strong></button><span class="pill">+10 XP</span></div>`}).join('')}</div><div class="status" style="margin-top:12px"><strong>Project:</strong> ${esc(PROJECTS.find(p=>p.level===+l.id)?.brief||'Build a project from this level.')} · Complete the level, then apply the skills in a real build.</div></div>`}).join('')}
function renderLesson(id){const el=document.getElementById('view-lesson'); if(parseRoute().view!=='lesson')return; const requested=lessonById(id); if(requested && !levelUnlocked(requested.level)){el.innerHTML=`<div class="hero"><div class="eyebrow">Level locked</div><h2>Finish the previous level first.</h2><p>Complete every lesson in Level ${requested.level-1} to unlock this lesson. Your progress is preserved.</p><button class="primary" onclick="go('learn')">Back to roadmap</button></div>`; return;} const l=requested||firstIncomplete(); currentLesson=l; const done=state.completedLessons.includes(l.id), practice=state.lessonPractice[l.id], quiz=state.quizResults[l.id]; const nextCandidate=nextLessonFor(l.id); const next=nextCandidate && (nextCandidate.level===l.level || levelUnlocked(nextCandidate.level)) ? nextCandidate : null; const previous=LESSONS[LESSONS.findIndex(x=>x.id===l.id)-1]; const note=state.notes[l.id]||''; const bookmark=state.bookmarks.includes(l.id); quizScore[l.id]=quizScore[l.id]??0; const qBlock=l.quiz.map((q,qi)=>{const sel=quizSelection[`${l.id}-${qi}`]; return `<div style="margin-top:14px"><strong>${qi+1}. ${esc(q.q)}</strong>${q.options.map((o,oi)=>`<button class="quiz-opt ${sel===oi?'selected':''}" onclick="pickQuiz('${l.id}',${qi},${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join('')}</div>`}).join(''); el.innerHTML=`<div class="lesson-wrap"><article class="lesson-main"><div class="eyebrow">Level ${l.level} · ${esc(l.levelTitle)}</div><h1>${esc(l.title)}</h1><div class="pill">Lesson ${l.order} of 8</div><div class="hook"><strong>Why this matters</strong><p>${esc(l.why)}</p></div><div class="section"><h3>🎯 Objective</h3><p>${esc(l.objective)}</p></div><div class="section"><h3>🧠 Core concept</h3><p>${esc(l.concept)}</p></div><div class="section"><h3>⌨ Syntax pattern</h3><pre><code>${esc(l.syntax)}</code></pre></div><div class="section"><h3>▶ Example</h3><pre><code>${esc(l.code)}</code></pre><button class="small-btn" onclick="sendLessonToLab('${l.id}')">Open this example in Code Lab</button></div><div class="section"><h3>🔍 How Python thinks</h3><p class="explain">${esc(l.explanation)}</p></div><div class="section"><h3>⚠ Common mistakes</h3><div class="checklist">${l.mistakes.map(x=>`<div class="status">${esc(x)}</div>`).join('')}</div></div><div class="section"><h3>🧪 Practice</h3><div class="status">${esc(l.practice)}</div><button class="primary" style="margin-top:10px" onclick="markPractice('${l.id}')">${practice?'Practice recorded ✓':'Mark practice complete'}</button></div><div class="section"><h3>🧩 Quick mastery check</h3>${qBlock}<button class="primary" style="margin-top:14px" onclick="gradeQuiz('${l.id}')">Check answers</button><div id="quiz-result-${l.id}" class="status" style="margin-top:10px">${quiz!==undefined?`Saved best score: ${quiz} / ${l.quiz.length}`: 'Answer both questions to finish the check.'}</div></div><div class="section"><h3>📝 Notes</h3><textarea id="lesson-note-${l.id}" style="width:100%;min-height:120px;background:#0f1628;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px">${esc(note)}</textarea><button class="small-btn" style="margin-top:8px" onclick="saveNote('${l.id}')">Save note</button></div><div class="toolbar" style="margin-top:24px"><button class="ghost" ${previous?`onclick="go('lesson','${previous.id}')"`: 'disabled'}>← Previous</button><span class="spacer"></span><button class="ghost" onclick="toggleBookmark('${l.id}')">${bookmark?'★ Bookmarked':'☆ Bookmark'}</button><button class="primary" onclick="completeLesson('${l.id}')">${done?'Mastered ✓':'Mark lesson mastered'}</button><button class="ghost" ${next?`onclick="go('lesson','${next.id}')"`:'disabled'}>Next →</button></div></article><aside class="lesson-side"><div class="eyebrow">Mastery</div><h3>${done?'Lesson mastered':'In progress'}</h3><div class="progress"><span style="width:${done?100:Math.max(practice?50:10,quiz!==undefined?80:10)}%"></span></div><p class="muted">Recommended flow: read → run → practice → check → master.</p><div class="status">XP: <strong>+10</strong> for mastering this lesson.</div><div class="section"><h3>Level progress</h3><p>${levelProgress(l.level).done} / 8 lessons mastered.</p></div><button class="ghost" onclick="go('learn')">Back to roadmap</button></aside></div>`;}
function pickQuiz(id,qi,oi){quizSelection[`${id}-${qi}`]=oi; renderLesson(id);}
function gradeQuiz(id){const l=lessonById(id); let score=0; l.quiz.forEach((q,i)=>{if(quizSelection[`${id}-${i}`]===q.answer)score++;}); quizScore[id]=score; state.quizResults[id]=Math.max(state.quizResults[id]??-1,score); if(!state.quizXpAwarded[id]){state.xp+=score*2; state.quizXpAwarded[id]=true;} save(); setTimeout(()=>{const x=document.getElementById('quiz-result-'+id); if(x)x.textContent=`Score: ${score} / ${l.quiz.length}. ${score===l.quiz.length?'Perfect — mastery check passed.':'Review the explanations and try again.'}`; },0);}
function markPractice(id){if(!state.lessonPractice[id]){state.lessonPractice[id]=true; if(!state.practiceAwarded[id]){state.xp+=3; state.practiceAwarded[id]=true;}} save();}
function completeLesson(id){const l=lessonById(id); if(!state.lessonPractice[id]||state.quizResults[id]!==l.quiz.length){alert('Finish Practice and get a perfect Quick Mastery Check before marking the lesson mastered.'); return;} if(!state.completedLessons.includes(id)){state.completedLessons.push(id);state.xp+=10;} save();}
function toggleBookmark(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();}
function saveNote(id){state.notes[id]=document.getElementById('lesson-note-'+id).value;save();}
function sendLessonToLab(id){state.labCode=lessonById(id).code;save();go('lab')}
function renderLab(){const el=document.getElementById('view-lab'); if(labRunning===false){} el.innerHTML=`<div class="hero"><div class="eyebrow">Browser Python Lab</div><h2>Experiment without leaving the course.</h2><p>Your code runs in a Web Worker using Pyodide. The worker is terminated after a timeout so a runaway loop cannot freeze the page.</p></div><div class="lab"><div class="card"><h3>Editor</h3><textarea id="editor" class="editor" spellcheck="false">${esc(state.labCode)}</textarea><label class="muted" style="display:block;margin:10px 0 6px">Input for <code>input()</code> — one value per line</label><textarea id="labInput" style="width:100%;min-height:90px;resize:vertical;background:#090e18;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font-family:monospace">${esc(state.labInput||'')}</textarea><div class="toolbar"><button class="primary" onclick="runCode()">▶ Run</button><button class="ghost" onclick="stopCode()">■ Stop</button><button class="ghost" onclick="clearLab()">Clear</button><button class="ghost" onclick="copyLab()">Copy</button><span class="spacer"></span><span class="pill">3s execution limit</span></div></div><div class="card"><h3>Output</h3><div id="labOutput" class="lab-output">Ready. Press Run.</div><div class="toolbar"><span class="muted" style="font-size:12px">Tip: enter values in the Input box, one line per input().</span></div></div></div>`;}
function clearLab(){state.labCode='';save(); const e=document.getElementById('editor'); if(e)e.value=''; const o=document.getElementById('labOutput'); if(o)o.textContent='Ready. Press Run.';}
async function copyLab(){const e=document.getElementById('editor'); try{await navigator.clipboard.writeText(e.value); alert('Code copied.')}catch{alert('Copy failed — select the code and copy it manually.')}}
function makeWorker(){const src=`self.onmessage=async(e)=>{try{importScripts('https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js'); const pyodide=await loadPyodide(); const outputs=[]; pyodide.setStdout({batched:s=>outputs.push(s)}); pyodide.setStderr({batched:s=>outputs.push(s)}); const inp=JSON.stringify(e.data.input||''); await pyodide.runPythonAsync(\`import io,sys\nsys.stdin=io.StringIO(${inp})\`); await pyodide.runPythonAsync(e.data.code); self.postMessage({ok:true,out:outputs.join('')})}catch(err){self.postMessage({ok:false,out:String(err)})}};`; return new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));}
function runCode(){if(labRunning)return; const code=document.getElementById('editor').value; const input=document.getElementById('labInput')?.value||''; state.labCode=code; state.labInput=input; localStorage.setItem(KEY,JSON.stringify(state)); const out=document.getElementById('labOutput'); out.textContent='Loading Python runtime and executing…'; labRunning=true; worker=makeWorker(); const timer=setTimeout(()=>{if(worker)worker.terminate();worker=null;labRunning=false;const o=document.getElementById('labOutput');if(o)o.textContent='Execution stopped: time limit reached (3 seconds).';},3000); worker.onmessage=e=>{clearTimeout(timer);labRunning=false;const o=document.getElementById('labOutput');if(o)o.textContent=e.data.out||'(no output)';if(worker)worker.terminate();worker=null;}; worker.onerror=e=>{clearTimeout(timer);labRunning=false;const o=document.getElementById('labOutput');if(o)o.textContent='Worker error: '+e.message;if(worker)worker.terminate();worker=null;}; worker.postMessage({code,input});}
function stopCode(){if(worker){worker.terminate();worker=null;}labRunning=false;const o=document.getElementById('labOutput');if(o)o.textContent='Execution stopped.';}
function renderChallenges(){const el=document.getElementById('view-challenges'); const route=parseRoute(); if(route.id){const c=CHALLENGES.find(x=>x.id===route.id); if(c){el.innerHTML=`<div class="hero"><div class="eyebrow">Challenge · Level ${c.level}</div><h2>${esc(c.title)}</h2><p>${esc(c.description)}</p><div class="hook"><strong>Hint</strong><p>${esc(c.hint)}</p></div></div><div class="challenge"><div class="card"><h3>Write your solution</h3><textarea id="challengeCode" class="editor">print("solve me")</textarea><div class="toolbar"><button class="primary" onclick="runChallenge('${c.id}')">Run & check</button><button class="ghost" onclick="go('challenges')">Back</button></div><div id="challengeStatus" class="status">Add your solution and run the tests.</div></div><div class="card"><h3>Test cases</h3>${c.tests.map((t,i)=>`<div class="testcase"><strong>Test ${i+1}</strong><div class="muted">Input: <code>${esc(t.input).replaceAll('\n',' ↵ ')}</code></div><div class="muted">Expected: <code>${esc(t.expected)}</code></div></div>`).join('')}</div></div>`; return;}} el.innerHTML=`<div class="hero"><div class="eyebrow">Practice center</div><h2>Turn knowledge into proof.</h2><p>Challenges are separate from lessons so you can practice retrieval instead of only rereading.</p></div><div class="grid grid-2">${CHALLENGES.map(c=>{const done=state.completedChallenges.includes(c.id); const unlocked=levelUnlocked(c.level); return `<div class="card ${unlocked?'':'lock'}"><div class="pill">Level ${c.level}</div><h3 style="margin-top:10px">${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="toolbar"><button class="primary" ${unlocked?'':'disabled'} onclick="openChallenge('${c.id}')">${done?'Review':'Open challenge'}</button><span class="pill">${done?'Solved ✓':'+25 XP'}</span></div></div>`}).join('')}</div>`}
function openChallenge(id){currentChallenge=CHALLENGES.find(c=>c.id===id); go('challenges',id);}
function renderSearch(){const el=document.getElementById('view-search'); const r=parseRoute(); const term=document.getElementById('globalSearch').value.trim(); if(r.view!=='search'&&!term)return; const hits=term?LESSONS.filter(l=>(l.title+' '+l.levelTitle+' '+l.concept).toLowerCase().includes(term.toLowerCase())):[]; el.innerHTML=`<div class="hero"><div class="eyebrow">Search</div><h2>${term?'Results for “'+esc(term)+'”':'Find a lesson'}</h2><p>Search by topic, level, or concept.</p></div>${term?(hits.length?`<div class="grid">${hits.map(l=>`<div class="card"><div class="pill">Level ${l.level}</div><h3>${esc(l.title)}</h3><p>${esc(l.objective)}</p><button class="primary" onclick="go('lesson','${l.id}')">Open lesson</button></div>`).join('')}</div>`:'<div class="empty">No matching lessons found.</div>'):'<div class="empty">Type in the search box above.</div>'}`;}
async function runChallenge(id){const c=CHALLENGES.find(x=>x.id===id),code=document.getElementById('challengeCode').value,status=document.getElementById('challengeStatus'); status.className='status'; status.textContent='Running tests…'; const results=[]; for(const t of c.tests){const wrapped=`import io,sys\n__out=io.StringIO()\n__old=sys.stdout\nsys.stdout=__out\n${code}\nsys.stdout=__old\nprint(__out.getvalue().strip())`; try{const out=await executePython(wrapped,t.input||'',3000); results.push(out.trim()===t.expected.trim());}catch{results.push(false);} } const passed=results.every(Boolean); status.className='status '+(passed?'ok':'bad'); status.textContent=passed?'All tests passed! Challenge solved.':'Some tests failed. Read the expected output and adjust your code.'; if(passed&&!state.completedChallenges.includes(id)){state.completedChallenges.push(id);state.xp+=25;save();}}
function executePython(code,input,ms){return new Promise((resolve,reject)=>{const w=makeWorker(); const t=setTimeout(()=>{w.terminate();reject(new Error('timeout'))},ms); w.onmessage=e=>{clearTimeout(t);w.terminate();e.data.ok?resolve(e.data.out):reject(new Error(e.data.out))};w.onerror=e=>{clearTimeout(t);w.terminate();reject(e)};w.postMessage({code,input});})}
function renderProfile(){const el=document.getElementById('view-profile'); const mastered=state.completedLessons.length; const notes=Object.values(state.notes).filter(Boolean).length; el.innerHTML=`<div class="hero"><div class="eyebrow">Profile & progress</div><h2>Your private learning dashboard.</h2><p>No sign-in and no server database. Resetting clears this browser’s stored progress.</p></div><div class="grid grid-3"><div class="card"><div class="eyebrow">Mastery</div><h3>${pct(mastered,LESSONS.length)}%</h3><p>${mastered} of ${LESSONS.length} lessons</p></div><div class="card"><div class="eyebrow">Bookmarks</div><h3>${state.bookmarks.length}</h3><p>Lessons saved for review</p></div><div class="card"><div class="eyebrow">Notes</div><h3>${notes}</h3><p>Personal notes stored locally</p></div></div><div class="card" style="margin-top:16px"><div class="eyebrow">Level status</div>${CURRICULUM.map(l=>{const p=levelProgress(+l.id);return `<div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)"><div><strong>Level ${l.id} · ${esc(l.title)}</strong><div class="progress" style="margin-top:8px"><span style="width:${pct(p.done,p.total)}%"></span></div></div><span class="pill">${p.done} / ${p.total}</span></div>`}).join('')}</div><div class="toolbar" style="margin-top:16px"><button class="ghost" onclick="exportProgress()">Export progress</button><button class="ghost" onclick="importProgress()">Import progress</button><button class="danger" onclick="resetProgress()">Reset everything</button></div>`}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='python-academy-progress.json';a.click();URL.revokeObjectURL(a.href)}
function importProgress(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(KEY,String(r.result));state=loadState();save();alert('Progress imported successfully.')}catch{alert('Invalid progress file.')}};r.readAsText(file)};input.click();}
function resetProgress(){if(confirm('Reset all lessons, XP, notes, bookmarks, and challenges?')){localStorage.removeItem(KEY);state=structuredClone(DEFAULT);save();go('dashboard')}}
document.getElementById('resetBtn').onclick=resetProgress; document.getElementById('globalSearch').addEventListener('input',e=>{if(e.target.value.trim()){go('search');renderSearch();} else if(parseRoute().view==='search')go('dashboard')}); window.addEventListener('hashchange',renderAll); document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}}); recordActivity(); renderAll();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body></html>
