<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skulpt Test</title>
<script src="./assets/js/skulpt.min.js"></script>
<script src="./assets/js/skulpt-stdlib.js"></script>
<style>
  body { font-family: monospace; background: #0b1020; color: #eef4ff; padding: 20px; }
  #status { padding: 10px; margin: 10px 0; border-radius: 8px; }
  .ok { background: #1a3a2a; color: #20c997; }
  .err { background: #3a1a1a; color: #ff6b6b; }
  textarea { width: 100%; height: 120px; background: #11182b; color: #eef4ff; border: 1px solid #232d46; border-radius: 8px; padding: 10px; font-family: monospace; }
  button { background: #7c5cff; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin: 5px; }
  pre { background: #11182b; padding: 15px; border-radius: 8px; min-height: 60px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>🐍 Skulpt Engine Test</h2>

<div id="status">Loading...</div>

<h3>Code Editor</h3>
<textarea id="code">print("Hello from Skulpt!")
print(2 + 2)
name = input("Enter your name: ")
print("Hello,", name)
</textarea>

<h3>Input (one value per line)</h3>
<textarea id="stdin" style="height:60px">Alice</textarea>

<button onclick="runTest()">▶ Run Code</button>
<button onclick="clearOutput()">Clear</button>

<h3>Output</h3>
<pre id="output">Press Run to execute...</pre>

<h3>Diagnostics</h3>
<pre id="diag"></pre>

<script>
// Check if Skulpt loaded
window.addEventListener('load', function() {
  const status = document.getElementById('status');
  const diag = document.getElementById('diag');
  
  let info = [];
  info.push('Sk defined: ' + (typeof Sk !== 'undefined'));
  if (typeof Sk !== 'undefined') {
    info.push('Sk.misceval: ' + (typeof Sk.misceval !== 'undefined'));
    info.push('Sk.configure: ' + (typeof Sk.configure !== 'undefined'));
    info.push('Sk.importMainWithBody: ' + (typeof Sk.importMainWithBody !== 'undefined'));
    info.push('Sk.builtinFiles: ' + (typeof Sk.builtinFiles !== 'undefined'));
    status.textContent = '✅ Skulpt loaded successfully!';
    status.className = 'ok';
  } else {
    status.textContent = '❌ Skulpt NOT loaded — check script paths!';
    status.className = 'err';
  }
  diag.textContent = info.join('\n');
});

function runTest() {
  const output = document.getElementById('output');
  const code = document.getElementById('code').value;
  const stdinText = document.getElementById('stdin').value;
  
  if (typeof Sk === 'undefined') {
    output.textContent = 'ERROR: Skulpt is not loaded!';
    return;
  }
  
  output.textContent = 'Running...';
  
  const inputLines = stdinText.split('\n');
  let inputIdx = 0;
  let stdout = [];
  
  Sk.configure({
    output: function(str) { stdout.push(str); },
    read: function(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles['files'][x] === undefined) {
        throw new Error('File not found: ' + x);
      }
      return Sk.builtinFiles['files'][x];
    },
    inputfun: function(prompt) {
      if (prompt) stdout.push(prompt + '\n');
      return inputIdx < inputLines.length ? inputLines[inputIdx++] : '';
    },
    inputfunTakesPrompt: true,
    execLimit: 5000
  });
  
  Sk.misceval.asyncToPromise(function() {
    return Sk.importMainWithBody('<stdin>', false, code, true);
  }).then(function() {
    output.textContent = stdout.join('') || '(no output)';
  }).catch(function(err) {
    output.textContent = 'Python Error: ' + (err.toString ? err.toString() : String(err));
    console.error('Skulpt error:', err);
  });
}

function clearOutput() {
  document.getElementById('output').textContent = '';
}
</script>
</body>
</html>
