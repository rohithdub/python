er problems into smaller solvable pieces.","why":"You will use problem decomposition when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Break larger problems into smaller solvable pieces. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def parse_scores(text):\n    return [int(x) for x in text.split()]\n\ndef average(values):\n    return sum(values) / len(values)\n\nscores = parse_scores(\"80 90 70\")\nprint(average(scores))","code":"def parse_scores(text):\n    return [int(x) for x in text.split()]\n\ndef average(values):\n    return sum(values) / len(values)\n\nscores = parse_scores(\"80 90 70\")\nprint(average(scores))","explanation":"Decomposition turns a vague task into named steps. Separate parsing, computation, and presentation so each piece can be tested independently.","mistakes":["Using Problem Decomposition mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the linear search code. Try searching for a different number to see if its index is found.","quiz":[{"q":"What does problem decomposition mean?","options":["Deleting old code files","Breaking down a large, complex problem into smaller manageable parts","Speeding up internet speeds","Compiling code to machine language"],"answer":1},{"q":"Why is planning inputs and outputs before coding helpful?","options":["It eliminates the need for Python","It prevents all syntax errors","It defines what each part must achieve before writing details","It saves hard drive space"],"answer":2}],"id":"L5_1","level":5,"levelTitle":"Problem Solving & Algorithms","order":1,"title":"Problem Decomposition"},{"objective":"Estimate how algorithms scale.","why":"You will use time & space complexity when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Estimate how algorithms scale. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Time & Space Complexity\n\n# Write the smallest working example first.","code":"items = [10, 20, 30, 40]\n# Linear scan: O(n)\ntarget = 30\nfor value in items:\n    if value == target:\n        print(\"found\")\n        break","explanation":"Big-O describes growth as input size increases. A single full pass is typically O(n); repeatedly halving a search space leads to O(log n).","mistakes":["Using Time & Space Complexity mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the binary search code. Try changing the target number to an item at the beginning or end of the list.","quiz":[{"q":"What does Big O notation describe in computer science?","options":["How an algorithm’s runtime or memory scales with input size","The file size in kilobytes","The version of Python installed","The number of comments in code"],"answer":0},{"q":"What is the time complexity of looking up an item by key in a dictionary?","options":["O(N^2) - quadratic","O(1) - constant time on average","O(N!) - factorial","O(log N)"],"answer":1}],"id":"L5_2","level":5,"levelTitle":"Problem Solving & Algorithms","order":2,"title":"Time & Space Complexity"},{"objective":"Search collections one item at a time and understand O(n).","why":"You will use linear search when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Search collections one item at a time and understand O(n). Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def linear_search(items, target):\n    for index, value in enumerate(items):\n        if value == target:\n            return index\n    return -1\n\nprint(linear_search([9, 4, 2, 8], 2))","code":"def linear_search(items, target):\n    for index, value in enumerate(items):\n        if value == target:\n            return index\n    return -1\n\nprint(linear_search([9, 4, 2, 8], 2))","explanation":"Linear search checks elements one by one and stops at the first match. Its worst-case time grows linearly with the collection size.","mistakes":["Using Linear Search mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the recursion code. Try calling the function with a smaller number like 3 or 4.","quiz":[{"q":"How does Linear Search find a target item in a list?","options":["Jumps directly to the middle","Requires the list to be sorted first","Uses binary division","Checks each item one by one from start to finish"],"answer":3},{"q":"What is the worst-case time complexity of Linear Search for N items?","options":["O(N)","O(1)","O(log N)","O(N^2)"],"answer":0}],"id":"L5_3","level":5,"levelTitle":"Problem Solving & Algorithms","order":3,"title":"Linear Search"},{"objective":"Use sorted data for logarithmic search.","why":"You will use binary search when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use sorted data for logarithmic search. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Binary Search\n\n# Write the smallest working example first.","code":"items = [3, 7, 11, 20, 31, 45]\ntarget = 20\nlo, hi = 0, len(items) - 1\nwhile lo <= hi:\n    mid = (lo + hi) // 2\n    if items[mid] == target:\n        print(\"found at\", mid)\n        break\n    if items[mid] < target:\n        lo = mid + 1\n    else:\n        hi = mid - 1","explanation":"Binary search only works when the data is ordered. Each comparison eliminates about half of the remaining candidates.","mistakes":["Using Binary Search mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the accumulator pattern. Try changing the numbers in the list to calculate a new total.","quiz":[{"q":"What requirement must a list satisfy before you can use Binary Search?","options":["The list must contain only words","The list must have an odd length","The list must already be sorted","The list cannot have numbers"],"answer":2},{"q":"What is the time complexity of Binary Search?","options":["O(N)","O(N^2)","O(1)","O(log N)"],"answer":3}],"id":"L5_4","level":5,"levelTitle":"Problem Solving & Algorithms","order":4,"title":"Binary Search"},{"objective":"Understand simple sorting strategies and when to use built-ins.","why":"You will use sorting concepts when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand simple sorting strategies and when to use built-ins. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"values = [5, 1, 4, 2]\nprint(sorted(values))\nprint(sorted(values, reverse=True))","code":"values = [5, 1, 4, 2]\nprint(sorted(values))\nprint(sorted(values, reverse=True))","explanation":"Python’s built-in sorted is optimized and usually preferable for application code. Learning sorting algorithms helps you understand trade-offs even when you use the built-in.","mistakes":["Using Sorting Concepts mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the sorting code. Try passing reverse=True to sort the numbers in descending order.","quiz":[{"q":"Which built-in function returns a new sorted list in Python?","options":["sort()","sorted()","order()","arrange()"],"answer":1},{"q":"How do you sort in descending order using sorted()?","options":["sorted(items, down=True)","reverse(sorted(items))","sorted(items, reverse=True)","sorted(items, -1)"],"answer":2}],"id":"L5_5","level":5,"levelTitle":"Problem Solving & Algorithms","order":5,"title":"Sorting Concepts"},{"objective":"Solve sequence problems with coordinated indices.","why":"You will use two-pointer patterns when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Solve sequence problems with coordinated indices. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"values = [1, 2, 3, 4, 5, 6]\nleft, right = 0, len(values) - 1\nwhile left < right:\n    print(values[left], values[right])\n    left += 1\n    right -= 1","code":"values = [1, 2, 3, 4, 5, 6]\nleft, right = 0, len(values) - 1\nwhile left < right:\n    print(values[left], values[right])\n    left += 1\n    right -= 1","explanation":"Two pointers track positions from the same or opposite ends. They often turn nested scans into linear-time solutions.","mistakes":["Using Two-Pointer Patterns mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the two-pointer loop. Watch how the pointers step toward each other from both ends.","quiz":[{"q":"How does the Two-Pointer technique work?","options":["Uses two indices (e.g. left and right) that move toward each other or step forward","Uses two computers simultaneously","Runs two Python scripts at once","Creates two identical variables"],"answer":0},{"q":"When is the two-pointer technique especially useful?","options":["Formatting text strings","Searching or reversing elements in sorted arrays or palindrome checking","Printing debug logs","Importing modules"],"answer":1}],"id":"L5_6","level":5,"levelTitle":"Problem Solving & Algorithms","order":6,"title":"Two-Pointer Patterns"},{"objective":"Use dictionaries and sets to solve counting problems.","why":"You will use frequency counting when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use dictionaries and sets to solve counting problems. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"from collections import Counter\n\nwords = \"python code python data\".split()\nprint(Counter(words))","code":"from collections import Counter\n\nwords = \"python code python data\".split()\nprint(Counter(words))","explanation":"Counting patterns turn repeated observations into a dictionary-like frequency table. Counter is a convenient standard-library tool for this job.","mistakes":["Using Frequency Counting mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the frequency counter. Try adding more repeated words to the text to see the count update.","quiz":[{"q":"Which module provides the Counter class in Python?","options":["math","sys","itertools","collections"],"answer":3},{"q":"What does Counter([\"a\", \"b\", \"a\"]) return?","options":["Counter({\"a\": 2, \"b\": 1})","3","[\"a\", \"b\"]","True"],"answer":0}],"id":"L5_7","level":5,"levelTitle":"Problem Solving & Algorithms","order":7,"title":"Frequency Counting"},{"objective":"Build a compact algorithm practice library.","why":"You will use algorithms project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build a compact algorithm practice library. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def linear_search(items, target):\n    for i, value in enumerate(items):\n        if value == target:\n            return i\n    return -1\n\nprint(linear_search([4, 8, 15, 16, 23, 42], 23))","code":"def linear_search(items, target):\n    for i, value in enumerate(items):\n        if value == target:\n            return i\n    return -1\n\nprint(linear_search([4, 8, 15, 16, 23, 42], 23))","explanation":"Build a small algorithm library with clean function interfaces and tests for normal, missing, empty, and boundary cases.","mistakes":["Using Algorithms Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the algorithms project. Test it with inputs that are present and inputs that are absent.","quiz":[{"q":"What is an edge case in algorithm testing?","options":["A line of code at the top of a file","A syntax typo","An unusual or extreme input (such as an empty list or single item) that tests code resilience","A variable with two letters"],"answer":2},{"q":"Why is comparing your algorithm against test cases essential?","options":["It makes the code longer","It is required to run Python","It compiles the code to C","It proves your code works across both typical and boundary scenarios"],"answer":3}],"id":"L5_8","level":5,"levelTitle":"Problem Solving & Algorithms","order":8,"title":"Algorithms Project"},{"objective":"Handle errors deliberately with try/except/else/finally.","why":"You will use exceptions when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Handle errors deliberately with try/except/else/finally. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Exceptions\n\n# Write the smallest working example first.","code":"try:\n    number = int(input(\"Number: \"))\n    print(100 / number)\nexcept ValueError:\n    print(\"Please enter an integer.\")\nexcept ZeroDivisionError:\n    print(\"Number cannot be zero.\")","explanation":"Exceptions are runtime events. Handle expected failures near the operation that can fail, and avoid catching everything blindly.","mistakes":["Using Exceptions mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the exception handling code. Enter a valid number, then run again with 0 to see ZeroDivisionError handled gracefully.","quiz":[{"q":"Which block handles errors that occur inside a try block?","options":["catch","except","error","handle"],"answer":1},{"q":"Which block always runs, whether an error occurred or not?","options":["always","end","finally","else"],"answer":2}],"id":"L6_1","level":6,"levelTitle":"Intermediate Python","order":1,"title":"Exceptions"},{"objective":"Organize code into modules and packages.","why":"You will use modules & imports when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Organize code into modules and packages. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# math_tools.py\n# def add(a, b):\n#     return a + b\n\nimport math\nprint(math.sqrt(81))","code":"# math_tools.py\n# def add(a, b):\n#     return a + b\n\nimport math\nprint(math.sqrt(81))","explanation":"Modules separate responsibilities and make code reusable. Imports bring names from another module into the current namespace.","mistakes":["Using Modules & Imports mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see math module imports. Try computing math.pow(2, 5) or math.floor(4.7).","quiz":[{"q":"Which keyword brings in code from another Python file or library?","options":["import","include","require","using"],"answer":0},{"q":"How do you import only the sqrt function from the math module?","options":["import sqrt in math","from math import sqrt","math.import(sqrt)","include math::sqrt"],"answer":1}],"id":"L6_2","level":6,"levelTitle":"Intermediate Python","order":2,"title":"Modules & Imports"},{"objective":"Read, write, and manage text files using pathlib.","why":"You will use files & paths when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Read, write, and manage text files using pathlib. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Files & Paths\n\n# Write the smallest working example first.","code":"from pathlib import Path\n\npath = Path(\"notes.txt\")\npath.write_text(\"Python is practical!\", encoding=\"utf-8\")\nprint(path.read_text(encoding=\"utf-8\"))","explanation":"pathlib gives a clear object-oriented interface for filesystem paths. Specify encoding for predictable text handling.","mistakes":["Using Files & Paths mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the file writing and reading code. Try changing the text written to notes.txt.","quiz":[{"q":"Which modern standard library module is recommended for working with file paths?","options":["os.disk","file_tools","directory","pathlib"],"answer":3},{"q":"How do you quickly read text from a Path object in Python 3?","options":["path.read_text()","path.load()","path.getText()","read(path)"],"answer":0}],"id":"L6_3","level":6,"levelTitle":"Intermediate Python","order":3,"title":"Files & Paths"},{"objective":"Store structured data in JSON.","why":"You will use json & serialization when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Store structured data in JSON. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# JSON & Serialization\n\n# Write the smallest working example first.","code":"import json\n\ndata = {\"name\": \"Rohith\", \"score\": 95}\ntext = json.dumps(data, indent=2)\nprint(text)\nprint(json.loads(text)[\"score\"])","explanation":"JSON maps common Python data structures to text so programs can save or exchange structured information.","mistakes":["Using JSON & Serialization mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the JSON serialization code. Try adding a new field like \"role\": \"developer\" to the data dictionary.","quiz":[{"q":"Which method converts a Python dictionary into a JSON string?","options":["json.loads()","json.stringify()","json.dumps()","json.encode()"],"answer":2},{"q":"Which method parses a JSON string back into a Python dictionary?","options":["json.dumps()","json.parse()","json.decode()","json.loads()"],"answer":3}],"id":"L6_4","level":6,"levelTitle":"Intermediate Python","order":4,"title":"JSON & Serialization"},{"objective":"Work with datetime and common date calculations.","why":"You will use dates & time when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Work with datetime and common date calculations. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"from datetime import date, timedelta\n\ntoday = date.today()\nprint(today)\nprint(today + timedelta(days=7))","code":"from datetime import date, timedelta\n\ntoday = date.today()\nprint(today)\nprint(today + timedelta(days=7))","explanation":"datetime provides dedicated types for dates and times. Use timedelta for durations instead of manually adding numbers to calendar fields.","mistakes":["Using Dates & Time mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the date/time code. Try calculating the date 30 days into the future using timedelta(days=30).","quiz":[{"q":"Which module handles dates and times in Python?","options":["time_tools","datetime","calendar_os","clock"],"answer":1},{"q":"What object represents a duration or difference between two dates?","options":["timespan","duration","timedelta","diff"],"answer":2}],"id":"L6_5","level":6,"levelTitle":"Intermediate Python","order":5,"title":"Dates & Time"},{"objective":"Understand lazy iteration and yield.","why":"You will use iterators & generators when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand lazy iteration and yield. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def squares(limit):\n    for n in range(limit):\n        yield n * n\n\nfor value in squares(4):\n    print(value)","code":"def squares(limit):\n    for n in range(limit):\n        yield n * n\n\nfor value in squares(4):\n    print(value)","explanation":"A generator yields one value at a time instead of building the entire result in memory. This is useful for large or streaming data.","mistakes":["Using Iterators & Generators mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the generator function. Try changing the limit to generate squares up to 6.","quiz":[{"q":"Which keyword turns a regular function into a generator?","options":["yield","generate","return_stream","emit"],"answer":0},{"q":"What is a key benefit of using a generator over creating a huge list?","options":["Generators run in C++","Generators produce values one by one in memory on demand (lazy evaluation)","Generators cannot have loops","Generators require no syntax"],"answer":1}],"id":"L6_6","level":6,"levelTitle":"Intermediate Python","order":6,"title":"Iterators & Generators"},{"objective":"Understand reusable behavior wrappers and resource management.","why":"You will use decorators & context managers when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand reusable behavior wrappers and resource management. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"from contextlib import contextmanager\n\n@contextmanager\ndef label(name):\n    print(\"start\", name)\n    try:\n        yield\n    finally:\n        print(\"end\", name)\n\nwith label(\"demo\"):\n    print(\"inside\")","code":"from contextlib import contextmanager\n\n@contextmanager\ndef label(name):\n    print(\"start\", name)\n    try:\n        yield\n    finally:\n        print(\"end\", name)\n\nwith label(\"demo\"):\n    print(\"inside\")","explanation":"Decorators wrap behavior around functions; context managers wrap setup and cleanup around a with block. Both help make resource-handling patterns reusable.","mistakes":["Using Decorators & Context Managers mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the context manager code. Try changing the label text to see how enter and exit messages print.","quiz":[{"q":"What symbol is used to apply a decorator to a function?","options":["#","$","&","@"],"answer":3},{"q":"Which statement ensures clean setup and teardown (like closing files) using context managers?","options":["with","using","open_block","manage"],"answer":0}],"id":"L6_7","level":6,"levelTitle":"Intermediate Python","order":7,"title":"Decorators & Context Managers"},{"objective":"Build a local expense tracker with JSON persistence.","why":"You will use intermediate project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build a local expense tracker with JSON persistence. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"import json\nfrom pathlib import Path\n\npath = Path(\"expenses.json\")\nexpenses = [{\"name\":\"books\", \"amount\":500}]\npath.write_text(json.dumps(expenses), encoding=\"utf-8\")\nprint(json.loads(path.read_text(encoding=\"utf-8\")))","code":"import json\nfrom pathlib import Path\n\npath = Path(\"expenses.json\")\nexpenses = [{\"name\":\"books\", \"amount\":500}]\npath.write_text(json.dumps(expenses), encoding=\"utf-8\")\nprint(json.loads(path.read_text(encoding=\"utf-8\")))","explanation":"Combine files, JSON, exceptions, and functions into a small persistence-based application.","mistakes":["Using Intermediate Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the intermediate project. Try adding an extra expense item to the saved data.","quiz":[{"q":"Why is persistent storage (like saving to JSON files) useful in applications?","options":["It makes the program look cooler","It makes loops run faster","It keeps user data and progress saved even after the program closes","It prevents syntax errors"],"answer":2},{"q":"How do you ensure files are saved with universal character encoding?","options":["mode=\"ascii\"","charset=\"default\"","format=\"raw\"","encoding=\"utf-8\""],"answer":3}],"id":"L6_8","level":6,"levelTitle":"Intermediate Python","order":8,"title":"Intermediate Project"},{"objective":"Model data and behavior with classes.","why":"You will use classes & objects when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Model data and behavior with classes. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Classes & Objects\n\n# Write the smallest working example first.","code":"class Student:\n    def __init__(self, name):\n        self.name = name\n\n    def greet(self):\n        return f\"Hi, I am {self.name}\"\n\nstudent = Student(\"Rohith\")\nprint(student.greet())","explanation":"A class defines a blueprint for objects. Each object can hold state and expose behaviors through methods.","mistakes":["Using Classes & Objects mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the class and object code. Try creating a second student object like s2 = Student(\"Maya\") and call greet()!","quiz":[{"q":"What is a class in Python?","options":["A collection of comments","A blueprint for creating objects with shared attributes and behaviors","A list of numbers","A type of for loop"],"answer":1},{"q":"What is an instance of a class called?","options":["A method","A module","An object","A package"],"answer":2}],"id":"L7_1","level":7,"levelTitle":"Object-Oriented Python","order":1,"title":"Classes & Objects"},{"objective":"Initialize objects and manage instance state.","why":"You will use constructors & attributes when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Initialize objects and manage instance state. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Course:\n    def __init__(self, title, lessons):\n        self.title = title\n        self.lessons = lessons\n\ncourse = Course(\"Python\", 88)\nprint(course.title, course.lessons)","code":"class Course:\n    def __init__(self, title, lessons):\n        self.title = title\n        self.lessons = lessons\n\ncourse = Course(\"Python\", 88)\nprint(course.title, course.lessons)","explanation":"__init__ initializes each new object. Instance attributes store state g small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the counter class methods. Try calling increment() multiple times and printing the final value.","quiz":[{"q":"What is encapsulation in OOP?","options":["Writing all code on one line","Creating infinite objects","Importing libraries","Bundling data and the methods that operate on that data inside a class"],"answer":3},{"q":"By convention, how do Python developers indicate an internal/private attribute?","options":["With a leading underscore like _value","With the private keyword","With uppercase letters","With exclamation marks"],"answer":0}],"id":"L7_3","level":7,"levelTitle":"Object-Oriented Python","order":3,"title":"Methods & Encapsulation"},{"objective":"Reuse and specialize behavior through inheritance.","why":"You will use inheritance when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Reuse and specialize behavior through inheritance. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Animal:\n    def speak(self):\n        return \"sound\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"woof\"\n\nprint(Dog().speak())","code":"class Animal:\n    def speak(self):\n        return \"sound\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"woof\"\n\nprint(Dog().speak())","explanation":"Inheritance lets a subclass reuse and specialize a parent class. Use it when the relationship is genuinely “is-a”; otherwise composition is often clearer.","mistakes":["Using Inheritance mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the inheritance code. Try creating another child class like Cat(Animal) that speaks \"meow\".","quiz":[{"q":"How does a child class inherit from a parent class in Python?","options":["class Child inherits Parent:","class Child extends Parent:","class Child(Parent):","class Child <- Parent:"],"answer":2},{"q":"Which function allows a child class to call methods from its parent class?","options":["parent()","base()","upper()","super()"],"answer":3}],"id":"L7_4","level":7,"levelTitle":"Object-Oriented Python","order":4,"title":"Inheritance"},{"objective":"Write code that works with different object types.","why":"You will use polymorphism when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Write code that works with different object types. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Cat:\n    def speak(self): return \"meow\"\nclass Dog:\n    def speak(self): return \"woof\"\n\nfor animal in [Cat(), Dog()]:\n    print(animal.speak())","code":"class Cat:\n    def speak(self): return \"meow\"\nclass Dog:\n    def speak(self): return \"woof\"\n\nfor animal in [Cat(), Dog()]:\n    print(animal.speak())","explanation":"Polymorphism means different objects can respond to the same operation. Client code can depend on behavior rather than a specific concrete class.","mistakes":["Using Polymorphism mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the polymorphism loop. Try adding a new animal class with a speak() method to the list.","quiz":[{"q":"What is polymorphism in object-oriented programming?","options":["An object with many names","Different classes can define methods with the same name, allowing them to be used interchangeably","A loop that changes shape","Multiple inheritance errors"],"answer":1},{"q":"If Cat and Dog both define speak(), what does [Cat(), Dog()] allow you to do?","options":["Merge the animals into one object","Cause a Python error","Call .speak() on each animal in a single loop without caring about its exact class","Delete both animals"],"answer":2}],"id":"L7_5","level":7,"levelTitle":"Object-Oriented Python","order":5,"title":"Polymorphism"},{"objective":"Represent data-focused objects cleanly.","why":"You will use dataclasses when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Represent data-focused objects cleanly. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Dataclasses\n\n# Write the smallest working example first.","code":"from dataclasses import dataclass\n\n@dataclass\nclass Product:\n    name: str\n    price: float\n\nitem = Product(\"Keyboard\", 999.0)\nprint(item)","explanation":"dataclasses reduce boilerplate for data-focused classes and provide useful generated methods such as __init__ and __repr__.","mistakes":["Using Dataclasses mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the dataclass code. Try instantiating another Product with your own name and price.","quiz":[{"q":"Which decorator simplifies creating classes that primarily store data?","options":["@dataclass","@schema","@model","@struct"],"answer":0},{"q":"What does @dataclass automatically generate for you?","options":["Database tables","__init__, __repr__, and equality comparison methods","User interface buttons","Network connections"],"answer":1}],"id":"L7_6","level":7,"levelTitle":"Object-Oriented Python","order":6,"title":"Dataclasses"},{"objective":"Prefer clear object relationships over unnecessary inheritance.","why":"You will use composition & design when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Prefer clear object relationships over unnecessary inheritance. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Engine:\n    def start(self): return \"engine on\"\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine()\n\nprint(Car().engine.start())","code":"class Engine:\n    def start(self): return \"engine on\"\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine()\n\nprint(Car().engine.start())","explanation":"Composition models “has-a” relationships by assembling smaller objects. It often reduces coupling compared with deep inheritance hierarchies.","mistakes":["Using Composition & Design mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the composition example. Notice how Car contains an Engine object. Try calling the engine start method.","quiz":[{"q":"What is composition in software design?","options":["Writing music in Python","Inheriting from 10 classes","Deleting old code","Building complex classes by combining simpler objects (\"has-a\" relationship)"],"answer":3},{"q":"Why is \"favor composition over inheritance\" common design advice?","options":["It creates flexible, loosely-coupled components that are easier to test and change","Inheritance is deprecated in Python 3","Composition makes code run twice as fast","Inheritance requires internet access"],"answer":0}],"id":"L7_7","level":7,"levelTitle":"Object-Oriented Python","order":7,"title":"Composition & Design"},{"objective":"Build a library management domain model.","why":"You will use oop project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build a library management domain model. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Book:\n    def __init__(self, title):\n        self.title = title\n        self.available = True\n    def borrow(self):\n        if not self.available:\n            return False\n        self.available = False\n        return True\n\nb = Book(\"Python\")\nprint(b.borrow(), b.available)","code":"class Book:\n    def __init__(self, title):\n        self.title = title\n        self.available = True\n    def borrow(self):\n        if not self.available:\n            return False\n        self.available = False\n        return True\n\nb = Book(\"Python\")\nprint(b.borrow(), b.available)","explanation":"Model a domain with objects that own their state and behavior. Start with a small set of responsibilities and grow only when needed.","mistakes":["Using OOP Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the OOP project. Try borrowing a book twice to verify that the second attempt returns False.","quiz":[{"q":"In an OOP project, how do objects communicate with each other?","options":["Through global text files","By changing monitor colors","By calling each other’s methods and passing data as arguments","Through internet downloads"],"answer":2},{"q":"What is a good sign that your OOP design is clean?","options":["Everything is written in one huge function","No classes have attributes","There are no methods","Each class has a clear responsibility and methods operate on object state"],"answer":3}],"id":"L7_8","level":7,"levelTitle":"Object-Oriented Python","order":8,"title":"OOP Project"},{"objective":"Make code intentions explicit with modern annotations.","why":"You will use type hints when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Make code intentions explicit with modern annotations. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Type Hints\n\n# Write the smallest working example first.","code":"def total(price: float, tax: float) -> float:\n    return price + tax\n\nprint(total(100.0, 18.0))","explanation":"Type hints document intent and help editors and type checkers catch mistakes. Python normally does not enforce them at runtime.","mistakes":["Using Type Hints mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the type-annotated function. Try passing different floating point numbers and observe the result.","quiz":[{"q":"What do Python type hints (like name: str) provide?","options":["Strict compilation like C++","Clarity for developers and static analysis tools without breaking runtime behavior","Faster CPU speeds","Automatic encryption"],"answer":1},{"q":"How do you indicate that a function returns a float?","options":["def get_total(): float","return: float","def get_total() -> float:","def float get_total():"],"answer":2}],"id":"L8_1","level":8,"levelTitle":"Advanced Python","order":1,"title":"Type Hints"},{"objective":"Use expressions for concise transformations without sacrificing readability.","why":"You will use advanced comprehensions when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use expressions for concise transformations without sacrificing readability. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"matrix = [[1, 2], [3, 4]]\nflat = [value for row in matrix for value in row]\nprint(flat)","code":"matrix = [[1, 2], [3, 4]]\nflat = [value for row in matrix for value in row]\nprint(flat)","explanation":"Nested comprehensions can flatten or transform structured data, but readability comes first. Split a complex expression into loops when needed.","mistakes":["Using Advanced Comprehensions mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the list comprehension. Try modifying the condition or creating your own comprehension for squared numbers.","quiz":[{"q":"What does [x for row in matrix for x in row] accomplish?","options":["Flattens a 2D matrix into a 1D list","Multiplies the matrix by 2","Reverses the matrix","Counts the rows"],"answer":0},{"q":"Can you use conditional if filtering inside a list comprehension?","options":["No, comprehensions cannot have if","Yes, like [x for x in items if x > 0]","Only in Python 2","Only with numbers"],"answer":1}],"id":"L8_2","level":8,"levelTitle":"Advanced Python","order":2,"title":"Advanced Comprehensions"},{"objective":"Compose transformations with higher-order functions.","why":"You will use functional programming when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Compose transformations with higher-order functions. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"values = [1, 2, 3, 4]\ndoubled = list(map(lambda x: x * 2, values))\nprint(doubled)","code":"values = [1, 2, 3, 4]\ndoubled = list(map(lambda x: x * 2, values))\nprint(doubled)","explanation":"Functional style emphasizes transformations and functions as values. Use it where it makes a data pipeline clearer, not merely shorter.","mistakes":["Using Functional Programming mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the map() and lambda function. Try using filter() to only keep numbers greater than 2.","quiz":[{"q":"Which function filters items from an iterable based on a condition?","options":["clean()","remove_if()","strip()","filter()"],"answer":3},{"q":"What does map(lambda x: x + 1, [1, 2, 3]) return?","options":["An iterator that yields [2, 3, 4]","The number 6","A syntax error","[1, 2, 3]"],"answer":0}],"id":"L8_3","level":8,"levelTitle":"Advanced Python","order":3,"title":"Functional Programming"},{"objective":"Search and transform structured text with re.","why":"You will use regular expressions when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Search and transform structured text with re. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Regular Expressions\n\n# Write the smallest working example first.","code":"import re\n\ntext = \"Order IDs: A12 B77 C03\"\nids = re.findall(r\"[A-Z]\\d+\", text)\nprint(ids)","explanation":"Regular expressions describe patterns in text. Keep patterns readable and use them when ordinary string methods are not enough.","mistakes":["Using Regular Expressions mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the regular expression search. Try matching different patterns or adding more IDs to the text.","quiz":[{"q":"Which module handles regular expressions in Python?","options":["regex_tools","pattern","re","text_search"],"answer":2},{"q":"What does re.findall(r\"\\d+\", text) extract from a string?","options":["All uppercase words","All spaces","All punctuation","All sequences of digits (numbers)"],"answer":3}],"id":"L8_4","level":8,"levelTitle":"Advanced Python","order":4,"title":"Regular Expressions"},{"objective":"Understand threads, processes, and when concurrency helps.","why":"You will use concurrency concepts when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand threads, processes, and when concurrency helps. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"from concurrent.futures import ThreadPoolExecutor\n\ndef square(n): return n * n\n\nwith ThreadPoolExecutor(max_workers=2) as pool:\n    print(list(pool.map(square, [1, 2, 3, 4])))","code":"from concurrent.futures import ThreadPoolExecutor\n\ndef square(n): return n * n\n\nwith ThreadPoolExecutor(max_workers=2) as pool:\n    print(list(pool.map(square, [1, 2, 3, 4])))","explanation":"Threads can overlap I/O-bound work; processes can use multiple CPU cores for CPU-bound work. Concurrency adds coordination costs, so measure and choose deliberately.","mistakes":["Using Concurrency Concepts mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the thread pool executor. Try adding more numbers to the map list to see concurrent processing.","quiz":[{"q":"What does ThreadPoolExecutor allow you to do?","options":["Stop the CPU","Run multiple independent tasks concurrently across worker threads","Create a new terminal","Compile Python to machine code"],"answer":1},{"q":"When is multithreading in Python most effective?","options":["For heavy pure CPU math calculations","For simple print statements","For I/O-bound tasks like downloading web pages or reading files","For writing comments"],"answer":2}],"id":"L8_5","level":8,"levelTitle":"Advanced Python","order":5,"title":"Concurrency Concepts"},{"objective":"Understand async/await and cooperative concurrency.","why":"You will use asyncio basics when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand async/await and cooperative concurrency. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# asyncio Basics\n\n# Write the smallest working example first.","code":"import asyncio\n\nasync def greet():\n    await asyncio.sleep(0.1)\n    print(\"done\")\n\nasyncio.run(greet())","explanation":"async/await lets a program pause one task while another ready task can make progress. It is useful for I/O-heavy concurrency.","mistakes":["Using asyncio Basics mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the asyncio task. Try scheduling a second async greeting with a different sleep time.","quiz":[{"q":"Which keyword defines an asynchronous coroutine in Python?","options":["async def","coroutine def","thread def","await def"],"answer":0},{"q":"Which keyword is used to pause execution until an async task finishes?","options":["pause","await","wait_for","sleep"],"answer":1}],"id":"L8_6","level":8,"levelTitle":"Advanced Python","order":6,"title":"asyncio Basics"},{"objective":"Measure before optimizing and choose data structures wisely.","why":"You will use performance & profiling when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Measure before optimizing and choose data structures wisely. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"import time\n\nstart = time.perf_counter()\nresult = sum(i*i for i in range(100000))\nelapsed = time.perf_counter() - start\nprint(result, f\"{elapsed:.5f}s\")","code":"import time\n\nstart = time.perf_counter()\nresult = sum(i*i for i in range(100000))\nelapsed = time.perf_counter() - start\nprint(result, f\"{elapsed:.5f}s\")","explanation":"Measure runtime with tools such as perf_counter before optimizing. Profile real workloads and improve the dominant cost instead of guessing.","mistakes":["Using Performance & Profiling mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the performance timer. Try running the loop with 200,000 items to see how elapsed time scales.","quiz":[{"q":"Which function from the time module provides high-precision performance timing?","options":["time.clock_now()","time.get_ms()","time.current()","time.perf_counter()"],"answer":3},{"q":"Why is profiling code before optimizing it important?","options":["It reveals the true bottlenecks so you only optimize what matters","It makes code shorter","It compiles the script","It is required to run tests"],"answer":0}],"id":"L8_7","level":8,"levelTitle":"Advanced Python","order":7,"title":"Performance & Profiling"},{"objective":"Build a log analyzer with parsing, typing, and performance awareness.","why":"You will use advanced project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build a log analyzer with parsing, typing, and performance awareness. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"import re\nfrom collections import Counter\n\nlog = \"ERROR E12 ERROR E12 INFO I2\"\ncodes = re.findall(r\"E\\d+\", log)\nprint(Counter(codes))","code":"import re\nfrom collections import Counter\n\nlog = \"ERROR E12 ERROR E12 INFO I2\"\ncodes = re.findall(r\"E\\d+\", log)\nprint(Counter(codes))","explanation":"Use parsing, regular expressions, collections, and measured processing to turn messy log text into useful structured information.","mistakes":["Using Advanced Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the advanced project. Try parsing different log message samples to check the frequency counts.","quiz":[{"q":"What is the benefit of combining regular expressions and Counter in log analysis?","options":["Decreases file download time","Prevents web crashes","Quickly parses structured patterns and counts occurrences of error codes or IPs","Replaces operating system logging"],"answer":2},{"q":"How should robust data pipelines handle missing or malformed log lines?","options":["Crash immediately","Delete the server","Restart the computer","Gracefully ignore or log the faulty line without crashing the entire batch"],"answer":3}],"id":"L8_8","level":8,"levelTitle":"Advanced Python","order":8,"title":"Advanced Project"},{"objective":"Build useful command-line interfaces.","why":"You will use cli applications when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build useful command-line interfaces. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"import argparse\n\nparser = argparse.ArgumentParser()\nparser.add_argument(\"name\")\n# Example command: python app.py Rohith\n# args = parser.parse_args()\n# print(f\"Hello {args.name}\")","code":"import argparse\n\nparser = argparse.ArgumentParser()\nparser.add_argument(\"name\")\n# Example command: python app.py Rohith\n# args = parser.parse_args()\n# print(f\"Hello {args.name}\")","explanation":"argparse turns command-line arguments into structured program input. A good CLI documents commands, validates inputs, and returns useful exit behavior.","mistakes":["Using CLI Applications mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the CLI argument script. Observe how argument parsing is configured in standard Python apps.","quiz":[{"q":"Which standard library module is built specifically for command-line arguments?","options":["cli_parser","argparse","terminal","cmdline"],"answer":1},{"q":"What helpful feature does argparse generate automatically?","options":["A website","A desktop icon","A standardized --help command with usage instructions","A sound effect"],"answer":2}],"id":"L9_1","level":9,"levelTitle":"Real-World Python","order":1,"title":"CLI Applications"},{"objective":"Separate configuration from code and manage secrets safely.","why":"You will use environment & configuration when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Separate configuration from code and manage secrets safely. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"import os\n\nmode = os.getenv(\"APP_MODE\", \"development\")\nprint(\"Running in\", mode)","code":"import os\n\nmode = os.getenv(\"APP_MODE\", \"development\")\nprint(\"Running in\", mode)","explanation":"Configuration should be changeable without editing source. Environment variables are commonly used for deployment settings and secrets; never hard-code credentials.","mistakes":["Using Environment & Configuration mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the environment variable check. Try changing the default fallback value in os.getenv().","quiz":[{"q":"How do you read an environment variable in Python?","options":["os.getenv(\"VARIABLE_NAME\")","sys.env(\"VARIABLE_NAME\")","env[\"VARIABLE_NAME\"]","get_var(\"VARIABLE_NAME\")"],"answer":0},{"q":"Why are environment variables preferred for API keys and database passwords?","options":["They make the code run twice as fast","They keep secrets out of source code and version control repositories","They encrypt the file system","They are required by Python"],"answer":1}],"id":"L9_2","level":9,"levelTitle":"Real-World Python","order":2,"title":"Environment & Configuration"},{"objective":"Write repeatable tests with unittest or pytest-style thinking.","why":"You will use testing fundamentals when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Write repeatable tests with unittest or pytest-style thinking. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Testing Fundamentals\n\n# Write the smallest working example first.","code":"import unittest\n\ndef add(a, b):\n    return a + b\n\nclass TestAdd(unittest.TestCase):\n    def test_basic(self):\n        self.assertEqual(add(2, 3), 5)\n\n# Run with: unittest.main()","explanation":"A test states an expected behavior and checks it repeatedly. Good tests are focused, deterministic, and easy to diagnose when they fail.","mistakes":["Using Testing Fundamentals mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the unit test code. Try adding a second test method that checks negative numbers like add(-2, 3) == 1.","quiz":[{"q":"Which built-in module provides a unit testing framework in Python?","options":["pytest_builtin","assert_framework","tester","unittest"],"answer":3},{"q":"Which method asserts that two values are equal in a TestCase?","options":["self.assertEqual(a, b)","self.assertMatch(a, b)","self.isSame(a, b)","self.check(a == b)"],"answer":0}],"id":"L9_3","level":9,"levelTitle":"Real-World Python","order":3,"title":"Testing Fundamentals"},{"objective":"Create useful diagnostic logs.","why":"You will use logging when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Create useful diagnostic logs. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Logging\n\n# Write the smallest working example first.","code":"import logging\n\nlogging.basicConfig(level=logging.INFO)\nlogging.info(\"Application started\")\nlogging.warning(\"Demo warning\")","explanation":"Logging records diagnostic information without mixing it into normal user output. Levels let you control verbosity.","mistakes":["Using Logging mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the logging code. Try adding an error log using logging.error(\"Sample error message\").","quiz":[{"q":"Why is the logging module preferred over print() statements in production?","options":["print() is deprecated in Python","logging runs in C++","It provides severity levels (INFO, WARNING, ERROR), timestamps, and file routing","logging makes text bold"],"answer":2},{"q":"Which log level is typically used for critical errors that require immediate attention?","options":["DEBUG","INFO","TRACE","ERROR or CRITICAL"],"answer":3}],"id":"L9_4","level":9,"levelTitle":"Real-World Python","order":4,"title":"Logging"},{"objective":"Understand requests, responses, JSON, and API workflows; use urllib in the standard library.","why":"You will use http & apis when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand requests, responses, JSON, and API workflows; use urllib in the standard library. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# HTTP & APIs\n\n# Write the smallest working example first.","code":"from urllib.request import urlopen\n\n# Example only: requires internet access\n# with urlopen(\"https://example.com\", timeout=5) as response:\n#     body = response.read().decode(\"utf-8\")\n#     print(response.status, len(body))","explanation":"HTTP APIs expose resources over requests and responses. In Python’s standard library, urllib can make basic HTTP requests; production apps often use a third-party client.","mistakes":["Using HTTP & APIs mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the HTTP API demonstration. Review the structure used to fetch and read web responses.","quiz":[{"q":"What does an HTTP status code of 200 mean from a web API?","options":["Not Found","OK (request succeeded)","Internal Server Error","Redirect"],"answer":1},{"q":"What data format is most commonly exchanged when calling REST APIs?","options":["Plain binary","Word documents","JSON","Excel sheets"],"answer":2}],"id":"L9_5","level":9,"levelTitle":"Real-World Python","order":5,"title":"HTTP & APIs"},{"objective":"Clean, aggregate, validate, and summarize tabular-like data.","why":"You will use data processing when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Clean, aggregate, validate, and summarize tabular-like data. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"rows = [{\"name\":\"Asha\", \"score\":\"90\"}, {\"name\":\"Ravi\", \"score\":\"75\"}]\nclean = [{\"name\":r[\"name\"], \"score\":int(r[\"score\"])} for r in rows if r[\"score\"].isdigit()]\nprint(sum(r[\"score\"] for r in clean) / len(clean))","code":"rows = [{\"name\":\"Asha\", \"score\":\"90\"}, {\"name\":\"Ravi\", \"score\":\"75\"}]\nclean = [{\"name\":r[\"name\"], \"score\":int(r[\"score\"])} for r in rows if r[\"score\"].isdigit()]\nprint(sum(r[\"score\"] for r in clean) / len(clean))","explanation":"Real data often arrives as text and may contain invalid rows. Clean, validate, transform, aggregate, then present the result.","mistakes":["Using Data Processing mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the data cleaning pipeline. Try adding another score record to calculate the updated average.","quiz":[{"q":"What is data cleaning in a data processing pipeline?","options":["Filtering invalid rows, converting types, and handling missing values","Wiping the hard drive","Formatting Python indentation","Deleting variable names"],"answer":0},{"q":"Which string method checks if a string consists entirely of digits?","options":[".isnumber()",".isdigit()",".isint()",".valid_number()"],"answer":1}],"id":"L9_6","level":9,"levelTitle":"Real-World Python","order":6,"title":"Data Processing"},{"objective":"Organize a Python project for sharing and maintenance.","why":"You will use packaging & project structure when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Organize a Python project for sharing and maintenance. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"project = {\n    \"app/\": [\"__init__.py\", \"main.py\"],\n    \"tests/\": [\"test_main.py\"],\n    \"README.md\": \"usage + setup\",\n}\nfor path, items in project.items():\n    print(path, items)","code":"project = {\n    \"app/\": [\"__init__.py\", \"main.py\"],\n    \"tests/\": [\"test_main.py\"],\n    \"README.md\": \"usage + setup\",\n}\nfor path, items in project.items():\n    print(path, items)","explanation":"A maintainable project separates application code, tests, documentation, and configuration. Consistent structure makes onboarding and packaging easier.","mistakes":["Using Packaging & Project Structure mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the package structure viewer. Try adding a \"docs/\" folder entry to the project dictionary.","quiz":[{"q":"What file in a directory tells Python that the folder can be treated as a package?","options":["main.py","package.json","setup.cfg","__init__.py"],"answer":3},{"q":"What is the purpose of a README.md file in a project?","options":["Explaining what the project does, how to set it up, and how to run it","Storing compiled bytecode","Configuring the operating system","Storing user passwords"],"answer":0}],"id":"L9_7","level":9,"levelTitle":"Real-World Python","order":7,"title":"Packaging & Project Structure"},{"objective":"Build a production-style CLI productivity tracker.","why":"You will use real-world project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build a production-style CLI productivity tracker. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"from datetime import date\n\ntasks = [{\"title\":\"Study Python\", \"done\":False}]\ntasks[0][\"done\"] = True\nprint(date.today(), tasks)","code":"from datetime import date\n\ntasks = [{\"title\":\"Study Python\", \"done\":False}]\ntasks[0][\"done\"] = True\nprint(date.today(), tasks)","explanation":"Bring together validation, persistence, structured data, testing, logging, and a clear command-line workflow into one maintainable application.","mistakes":["Using Real-World Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the real-world task manager project. Try toggling the task status and printing the updated list.","quiz":[{"q":"Why is keeping state cleanly separated from presentation logic a best practice?","options":["It reduces the number of files to 1","It compiles Python faster","It makes data easy to save, test, and update without touching the UI","It prevents all syntax errors"],"answer":2},{"q":"How can you persist project data between application runs?","options":["Leaving the computer on forever","Writing comments","Printing output to the screen","Saving to a file (like JSON, CSV, or SQLite)"],"answer":3}],"id":"L9_8","level":9,"levelTitle":"Real-World Python","order":8,"title":"Real-World Project"},{"objective":"Turn requirements into milestones, interfaces, and testable outcomes.","why":"You will use project planning when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Turn requirements into milestones, interfaces, and testable outcomes. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"milestones = [\"requirements\", \"prototype\", \"tests\", \"release\"]\nfor i, milestone in enumerate(milestones, 1):\n    print(i, milestone)","code":"milestones = [\"requirements\", \"prototype\", \"tests\", \"release\"]\nfor i, milestone in enumerate(milestones, 1):\n    print(i, milestone)","explanation":"Plan around outcomes and milestones. Define the smallest useful version first, then add complexity only when it serves a clear requirement.","mistakes":["Using Project Planning mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the milestone pipeline. Try adding a new milestone like \"beta testing\" to the roadmap list.","quiz":[{"q":"What is the first step in successful software project planning?","options":["Writing code immediately","Defining requirements and understanding what problem you are solving","Deploying to the cloud","Buying server hosting"],"answer":1},{"q":"Why is building a small prototype first helpful?","options":["It eliminates the need for testing","It is required by Git","It validates your core idea and discovers unknowns early","It makes the project finish automatically"],"answer":2}],"id":"L10_1","level":10,"levelTitle":"Professional Projects","order":1,"title":"Project Planning"},{"objective":"Use naming, small functions, documentation, and refactoring habits.","why":"You will use clean code when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use naming, small functions, documentation, and refactoring habits. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def calculate_total(prices):\n    \"\"\"Return the sum of non-negative prices.\"\"\"\n    return sum(price for price in prices if price >= 0)\n\nprint(calculate_total([100, 50, -1]))","code":"def calculate_total(prices):\n    \"\"\"Return the sum of non-negative prices.\"\"\"\n    return sum(price for price in prices if price >= 0)\n\nprint(calculate_total([100, 50, -1]))","explanation":"Clean code favors clear names, small functions, consistent conventions, and documentation where it reduces ambiguity.","mistakes":["Using Clean Code mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the clean code example. Try passing a list with both positive and negative values to verify filtering.","quiz":[{"q":"What is a core principle of clean code?","options":["Clear, descriptive naming and functions that are easy to read and understand","Writing code in as few characters as possible","Avoiding comments entirely","Using single-letter variable names"],"answer":0},{"q":"What does DRY stand for in software engineering?","options":["Do Run Yearly","Don't Repeat Yourself (avoid code duplication)","Deploy Real Yield","Data Routing Yield"],"answer":1}],"id":"L10_2","level":10,"levelTitle":"Professional Projects","order":2,"title":"Clean Code"},{"objective":"Separate UI, domain logic, data access, and utilities.","why":"You will use architecture basics when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Separate UI, domain logic, data access, and utilities. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def validate(value): return value.strip()\ndef save(value): print(\"SAVE\", value)\ndef run(raw):\n    value = validate(raw)\n    save(value)\n\nrun(\" task \")","code":"def validate(value): return value.strip()\ndef save(value): print(\"SAVE\", value)\ndef run(raw):\n    value = validate(raw)\n    save(value)\n\nrun(\" task \")","explanation":"Architecture separates responsibilities so changes remain local. Keep user interface, business rules, persistence, and utilities from becoming one large function.","mistakes":["Using Architecture Basics mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the architecture pipeline (validate -> run -> save). Try passing a string with leading whitespace.","quiz":[{"q":"What is separation of concerns in software architecture?","options":["Separating computers from the network","Writing only one line per file","Deleting old functions","Dividing an application into distinct sections that each handle a specific responsibility"],"answer":3},{"q":"In a 3-layer architecture, what does the business logic layer do?","options":["Executes the core application rules and workflows","Draws pixels on the screen","Controls the operating system power","Routes network cables"],"answer":0}],"id":"L10_3","level":10,"levelTitle":"Professional Projects","order":3,"title":"Architecture Basics"},{"objective":"Combine unit, integration, edge-case, and regression testing.","why":"You will use testing strategy when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Combine unit, integration, edge-case, and regression testing. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def clamp(value, low, high):\n    return max(low, min(value, high))\n\nassert clamp(5, 0, 10) == 5\nassert clamp(-1, 0, 10) == 0\nassert clamp(99, 0, 10) == 10\nprint(\"tests passed\")","code":"def clamp(value, low, high):\n    return max(low, min(value, high))\n\nassert clamp(5, 0, 10) == 5\nassert clamp(-1, 0, 10) == 0\nassert clamp(99, 0, 10) == 10\nprint(\"tests passed\")","explanation":"A testing strategy covers normal behavior, boundaries, invalid data, and regressions. Edge cases often reveal more defects than happy-path tests alone.","mistakes":["Using Testing Strategy mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the test assertion suite. Try adding a 4th assert clamp(50, 0, 100) == 50 to confirm it passes.","quiz":[{"q":"What is an assert statement used for in Python?","options":["Declaring a variable","Importing a module","Testing that a condition holds True, raising an AssertionError if it fails","Printing colored text"],"answer":2},{"q":"Why is automated testing essential for maintaining software over time?","options":["It replaces the need for a CPU","It makes Python files smaller","It writes code for you","It catches regressions and bugs immediately when you make changes or add features"],"answer":3}],"id":"L10_4","level":10,"levelTitle":"Professional Projects","order":4,"title":"Testing Strategy"},{"objective":"Validate input, protect secrets, and avoid unsafe dynamic execution.","why":"You will use security basics when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Validate input, protect secrets, and avoid unsafe dynamic execution. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Security Basics\n\n# Write the smallest working example first.","code":"def safe_username(value):\n    value = value.strip()\n    if not value or len(value) > 30:\n        raise ValueError(\"Invalid username\")\n    return value\n\nprint(safe_username(\"Rohith\"))","explanation":"Treat input as untrusted. Validate data, avoid dynamic execution such as eval on user text, and keep secrets outside source code.","mistakes":["Using Security Basics mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the input sanitization function. Try passing valid and invalid usernames to verify validation.","quiz":[{"q":"Why must you always sanitize and validate user input?","options":["To make typing faster","To prevent crashes, injection attacks, and invalid state from corrupting data","To change user passwords","To compress text files"],"answer":1},{"q":"What should a secure function do when given invalid input?","options":["Ignore it and continue silently","Crash the computer","Raise a clear exception or reject the input safely","Print the user’s password"],"answer":2}],"id":"L10_5","level":10,"levelTitle":"Professional Projects","order":5,"title":"Security Basics"},{"objective":"Use version control concepts and collaborative workflow habits.","why":"You will use git & collaboration when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use version control concepts and collaborative workflow habits. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"workflow = [\"branch\", \"change\", \"test\", \"commit\", \"review\", \"merge\"]\nprint(\" -> \".join(workflow))","code":"workflow = [\"branch\", \"change\", \"test\", \"commit\", \"review\", \"merge\"]\nprint(\" -> \".join(workflow))","explanation":"Version control gives you a history of changes and enables parallel work. Small focused commits and readable messages make collaboration easier.","mistakes":["Using Git & Collaboration mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the Git workflow chain. Observe each stage of a professional software release pipeline.","quiz":[{"q":"What is Git used for in software development?","options":["Tracking changes to source code and collaborating with teammates","Compiling Python to C","Formatting text files","Running tests automatically"],"answer":0},{"q":"What does creating a Git branch allow you to do?","options":["Delete the repository","Work on a new feature or experiment safely without affecting the main codebase","Turn off version control","Speed up download speeds"],"answer":1}],"id":"L10_6","level":10,"levelTitle":"Professional Projects","order":6,"title":"Git & Collaboration"},{"objective":"Prepare configuration, dependencies, documentation, and releases.","why":"You will use deployment thinking when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Prepare configuration, dependencies, documentation, and releases. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"release = {\"version\":\"1.0.0\", \"tests\":\"pass\", \"docs\":\"ready\", \"config\":\"externalized\"}\nfor k,v in release.items(): print(k, v)","code":"release = {\"version\":\"1.0.0\", \"tests\":\"pass\", \"docs\":\"ready\", \"config\":\"externalized\"}\nfor k,v in release.items(): print(k, v)","explanation":"Deployment preparation includes reproducible setup, configuration handling, tests, documentation, and a clear release version.","mistakes":["Using Deployment Thinking mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the deployment configuration dictionary. Try adding an \"environment\": \"production\" key.","quiz":[{"q":"What is the purpose of externalizing configuration (like database URLs)?","options":["Hiding code from users","Making the file size smaller","Preventing all bugs permanently","Allowing the tive way to continue growing as a Python developer?","options":["Memorize syntax without building anything","Stop practicing once you finish a tutorial","Copy code without understanding it","Build real projects, read documentation, write tests, and solve practical challenges"],"answer":3}],"id":"L10_8","level":10,"levelTitle":"Professional Projects","order":8,"title":"Capstone Portfolio"}];

function formatAdminDate(dateStr) {
  if (!dateStr) return '—';
  try {
    const s = String(dateStr);
    const d = new Date(s.endsWith('Z') || s.includes('+') ? s : s + 'Z');
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric'
      }) + ', ' + d.toLocaleTimeString(undefined, {
        hour: '2-digit', minute: '2-digit'
      });
    }
    const d2 = new Date(s);
    if (!isNaN(d2.getTime())) {
      return d2.toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric'
      }) + ', ' + d2.toLocaleTimeString(undefined, {
        hour: '2-digit', minute: '2-digit'
      });
    }
  } catch (e) {}
  return String(dateStr).slice(0, 16);
}
