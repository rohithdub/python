<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Python Academy — a complete personal Python learning environment from foundations to professional projects.">
<link rel="manifest" href="./manifest.json">
<script src="./assets/js/skulpt.min.js"></script>
<script src="./assets/js/skulpt-stdlib.js"></script>
<title>Python Academy</title>
<style>
:root {
  --bg: #0b1020;
  --panel: #11182b;
  --panel2: #161f36;
  --text: #eef4ff;
  --muted: #9aa8c2;
  --border: #232d46;
  --accent: #7c5cff;
  --accent2: #20c997;
  --warn: #f4b942;
  --danger: #ff6b6b;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }

body {
  background: radial-gradient(circle at 15% -10%, #1b2850 0, transparent 35%),
              radial-gradient(circle at 100% 0, #241b4c 0, transparent 30%),
              var(--bg);
  background-attachment: fixed;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--border);
  background: rgba(9, 14, 28, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 22px 16px;
  z-index: 20;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 4px 6px 22px;
}
.logo {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--accent), #38bdf8);
  display: grid;
  place-items: center;
  font-weight: 900;
  box-shadow: 0 10px 30px rgba(124, 92, 255, 0.32);
}
.brand h1 { font-size: 16px; margin: 0; font-weight: 800; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

.nav { display: grid; gap: 6px; flex: 1; overflow-y: auto; }
.nav button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 12px 14px;
  border-radius: 12px;
  text-align: left;
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s ease, color 0.15s ease;
  min-height: 44px;
}
.nav button:hover, .nav button.active {
  background: #171f35;
  color: var(--text);
}
.nav button.active {
  border-left: 3px solid var(--accent);
  border-top-left-radius: 4px;
  border-bottom-left-radius: 4px;
}

.sidebar-foot {
  padding: 16px 8px 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(11, 16, 32, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.topbar .title { font-weight: 800; font-size: 18px; white-space: nowrap; }
.actions { display: flex; gap: 8px; align-items: center; }

.icon-btn, .small-btn, .primary, .ghost, .danger {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 14px;
  background: var(--panel);
  color: var(--text);
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
  min-height: 38px;
}
.primary {
  background: linear-gradient(135deg, var(--accent), #6651e8);
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(124, 92, 255, 0.28);
}
.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.ghost { background: transparent; }
.ghost:hover { background: rgba(255, 255, 255, 0.05); }
.danger { color: #ff9a9a; background: transparent; border-color: rgba(255, 107, 107, 0.3); }
.danger:hover { background: rgba(255, 107, 107, 0.1); }

.container {
  max-width: 1260px;
  width: 100%;
  margin: 0 auto;
  padding: 26px 28px 100px;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

.hero {
  padding: 26px;
  border: 1px solid var(--border);
  background: linear-gradient(145deg, rgba(124, 92, 255, 0.14), rgba(32, 201, 151, 0.04) 55%, rgba(255, 255, 255, 0.01));
  border-radius: 22px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.eyebrow {
  color: #b9a7ff;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 11px;
  font-weight: 800;
}
h2 {
  margin: 8px 0 10px;
  font-size: clamp(24px, 3.8vw, 40px);
  line-height: 1.15;
  font-weight: 800;
}
h3 { margin: 0 0 8px; font-size: 18px; }
p { color: var(--muted); line-height: 1.7; margin: 0 0 10px; }

/* Responsive stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  margin: 18px 0 24px;
}
.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  min-width: 0;
}
.stat .n { font-size: clamp(20px, 4vw, 26px); font-weight: 900; }
.stat .l { color: var(--muted); font-size: 12px; margin-top: 4px; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

.card {
  background: rgba(17, 24, 43, 0.84);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
}
.card.clickable:hover {
  border-color: #40517a;
  transform: translateY(-1px);
}

.progress {
  height: 8px;
  background: #202a42;
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
}
.progress > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  background: #19233d;
  color: #bcc9e7;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.lock { opacity: 0.55; }

.level-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
}
.level-num {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: 14px;
  background: #1a2440;
  display: grid;
  place-items: center;
  font-weight: 900;
  color: #b8a8ff;
  font-size: 16px;
}
.lesson-list { display: grid; gap: 8px; margin-top: 14px; }
.lesson-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #0f1628;
  min-height: 48px;
}
.lesson-row.done { border-color: #254f47; background: #10231f; }
.lesson-row button {
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  padding: 0;
  font-size: 14px;
  word-break: break-word;
}
.check {
  width: 24px;
  height: 24px;
  min-width: 24px;
  border-radius: 50%;
  border: 1px solid #40506c;
  display: grid;
  place-items: center;
  font-size: 11px;
}
.done .check { background: #1f9d7a; border-color: #1f9d7a; color: #fff; }

.search {
  width: clamp(140px, 25vw, 320px);
  background: #0f1628;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 12px;
  outline: none;
  font-size: 14px;
  transition: width 0.2s ease, border-color 0.15s ease;
}
.search:focus, textarea:focus, input:focus { border-color: #7c5cff; }

/* Lesson Wrap: Fluid columns avoiding intermediate breakpoint overflow */
.lesson-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 20px;
  align-items: start;
}
.lesson-main, .lesson-side {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  min-width: 0;
}
.lesson-main h1 {
  font-size: clamp(24px, 3.5vw, 38px);
  margin: 8px 0 14px;
  line-height: 1.2;
}
.hook {
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  background: #151d34;
  border-radius: 0 12px 12px 0;
  margin: 18px 0;
}
.section { margin-top: 24px; min-width: 0; }
.section h3 { font-size: 16px; }
pre {
  margin: 12px 0;
  padding: 16px;
  border-radius: 14px;
  background: #0a0f1c;
  border: 1px solid #202a41;
  overflow-x: auto;
  line-height: 1.55;
  max-width: 100%;
}
code { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 13.5px; }
.explain { white-space: pre-wrap; color: #d8e1f3; line-height: 1.7; word-break: break-word; }
.checklist { display: grid; gap: 8px; }
.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  background: #0f1628;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px 14px;
  border-radius: 12px;
  margin-top: 8px;
  min-height: 46px;
  line-height: 1.4;
}
.quiz-opt.selected { border-color: #6d5eea; background: #1a2142; }
.quiz-opt.correct { border-color: #1d9f7c; background: #102e28; }
.quiz-opt.wrong { border-color: #cf5b5b; background: #2f181b; }

.lab {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 16px;
}
textarea.editor {
  width: 100%;
  min-height: 400px;
  resize: vertical;
  background: #090e18;
  color: #dce7fb;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 14px;
  line-height: 1.55;
  outline: none;
  tab-size: 4;
}
.lab-output {
  min-height: 400px;
  max-height: 550px;
  background: #090e18;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  white-space: pre-wrap;
  overflow: auto;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 14px;
  color: #dce7fb;
}
.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 10px 0;
}
.toolbar .spacer { flex: 1; }

.challenge {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 16px;
}
.testcase {
  padding: 12px 14px;
  background: #0e1525;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-top: 8px;
  word-break: break-word;
}
.status {
  padding: 11px 14px;
  border-radius: 12px;
  background: #121a2d;
  border: 1px solid var(--border);
  font-size: 13.5px;
  line-height: 1.5;
  word-break: break-word;
}
.status.ok { border-color: #266653; background: #10271f; }
.status.bad { border-color: #70414a; background: #2d151a; }

.mobile-nav { display: none; }
.empty { text-align: center; padding: 44px; color: var(--muted); }
.kbd {
  border: 1px solid var(--border);
  background: #141c30;
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 11px;
}

/* Modal styles for Auth and Cloud Sync */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 7, 15, 0.78);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}
.modal-card {
  background: #11182b;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.modal-header h3 { margin: 0; font-size: 18px; }
.close-btn {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 18px;
  padding: 4px;
}
.modal-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.modal-tabs button {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0c1322;
  color: var(--muted);
  font-weight: 600;
}
.modal-tabs button.active {
  background: #1b2646;
  border-color: var(--accent);
  color: #fff;
}
.form-group {
  margin-bottom: 14px;
}
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  background: #090e18;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 14px;
  outline: none;
}

/* Tablet & Intermediate Viewports */
@media (max-width: 1080px) {
  .lesson-wrap { grid-template-columns: 1fr; }
  .lesson-side { order: -1; }
}

@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .container {
    padding: 18px 16px calc(80px + env(safe-area-inset-bottom, 0px));
  }
  .topbar { padding: 12px 16px; }
  .challenge, .lab { grid-template-columns: 1fr; }
  .mobile-nav {
    position: fixed;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(62px + env(safe-area-inset-bottom, 0px));
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(10, 15, 29, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    z-index: 100;
  }
  .mobile-nav button {
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 10.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 2px;
    border-radius: 8px;
    min-height: 48px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mobile-nav button.active { color: #fff; background: rgba(124, 92, 255, 0.15); }
  .mobile-nav span { display: block; font-size: 18px; margin-bottom: 2px; }
}

/* Mobile Screens (< 560px) */
@media (max-width: 560px) {
  h2 { font-size: 26px; }
  .hero, .card, .lesson-main, .lesson-side { padding: 15px; border-radius: 16px; }
  .topbar { padding: 10px 12px; gap: 8px; }
  .topbar .title { display: none; }
  .actions { width: 100%; justify-content: space-between; }
  .search { flex: 1; min-width: 110px; max-width: none; }
  .cloud-text { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { padding: 12px; }
  .stat .n { font-size: 20px; }
  .stat .l { font-size: 11px; }
  .level-card {
    grid-template-columns: auto 1fr;
    gap: 12px;
  }
  .level-card button {
    grid-column: 1 / -1;
    justify-self: stretch;
    text-align: center;
    padding: 12px;
  }
  .lesson-row { padding: 10px 12px; gap: 10px; }
  textarea.editor, .lab-output { min-height: 270px; font-size: 16px; }
  input, textarea { font-size: 16px !important; }
}

@media (max-width: 350px) {
  .stats { grid-template-columns: 1fr; }
  .mobile-nav button { font-size: 9px; }
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">Py</div><div><h1>Python Academy</h1><p>Learn • Practice • Build</p></div></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-foot">Personal learning mode<br><span class="muted">Your data stays in this browser.</span></div>
</aside>
<main class="main">
  <header class="topbar">
  <div class="title" id="pageTitle">Dashboard</div>
  <div class="actions">
    <input id="globalSearch" class="search" placeholder="Search lessons…" aria-label="Search lessons">
    <button class="icon-btn" id="adminBtn" onclick="openAdminModal()" title="Admin Panel" style="border-color:rgba(245,158,11,0.4);color:#f59e0b">
      👑 <span class="cloud-text">Admin</span>
    </button>
    <button class="icon-btn" id="cloudBtn" onclick="openAuthModal()" title="Cloud Account & Sync">
      <span id="cloudDot" style="color:#20c997">●</span> <span id="cloudUserText" class="cloud-text">Cloud Sync</span>
    </button>
    <button class="icon-btn" id="resetBtn" title="Reset local progress">↺</button>
  </div>
</header>
  <div class="container">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-learn"></section>
    <section class="view" id="view-lesson"></section>
    <section class="view" id="view-lab"></section>
    <section class="view" id="view-challenges"></section>
    <section class="view" id="view-profile"></section>
    <section class="view" id="view-search"></section>
  </div>

  <div id="authModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeAuthModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Cloud Account & Sync</h3>
        <button class="close-btn" onclick="closeAuthModal()">✕</button>
      </div>
      <div id="authModalBody"></div>
    </div>
  </div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

:"Design behavior around object responsibilities. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"class Counter:\n    def __init__(self):\n        self._value = 0\n\n    def increment(self):\n        self._value += 1\n\n    def value(self):\n        return self._value\n\nc = Counter(); c.increment(); print(c.value())","code":"class Counter:\n    def __init__(self):\n        self._value = 0\n\n    def increment(self):\n        self._value += 1\n\n    def value(self):\n        return self._value\n\nc = Counter(); c.increment(); print(c.value())","explanation":"Methods keep behavior close to the state it manages. A leading underscore communicates that an attribute is an internal implementation detail.","mistakes":["Using Methods & Encapsulation mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the counter class methods. Try calling increment() multiple times and printing the final value.","quiz":[{"q":"What is encapsulation in OOP?","options":["Writing all code on one line","Creating infinite objects","Importing libraries","Bundling data and the methods that operate on that data inside a class"],"answer":3},{"q":"By convention, how do Python developers indicate an internal/private attribute?","options":["With a leading underscore like _value","With the private keyword","With uppercase letters","With exclamation marks"],"answer":0}],"id":"L7_3","level":7,"levelTitle":"Object-Oriented Python","order":3,"title":"Methods & Encapsulation","alternateQuiz":[{"q":"In Python, what is the naming convention to indicate an attribute is intended to be private or internal?","options":["Prefixing with a single or double underscore (e.g. _balance or __secret)","The 'private' keyword","Writing in all CAPS","Ending with .private"],"answer":0},{"q":"What decorator allows defining function formatAdminDate(dateStr) {
  if (!dateStr) return '—';
  try {
    const s = String(dateStr);
    const d = new Date(s.endsWith('Z') || s.includes('+') ? s : s + 'Z');
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric'
      }) + ', ' + d.toLocaleTimeString(undefined, {
        hour: '2-digit', minute: '2-digit'
      });
    }
    const d2 = new Date(s);
    if (!isNaN(d2.getTime())) {
      return d2.toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric'
      }) + ', ' + d2.toLocaleTimeString(undefined, {
        hour: '2-digit', minute: '2-digit'
      });
    }
  } catch (e) {}
  return String(dateStr).slice(0, 16);
}

    </div>
  `;
  setTimeout(() => { const el = document.getElementById('admin-pass-input'); if (el) { el.value = ''; } }, 40);
  setTimeout(() => { const el = document.getElementById('admin-pass-input'); if (el) { el.value = ''; el.removeAttribute('readonly'); } }, 200);
}

async function submitAdminPasskey() {
  const input = document.getElementById('admin-pass-input');
  if (!input) return;
  adminPasskey = input.value.trim();
  if (!adminPasskey) {
    renderAdminLoginPrompt('Please enter the administrator passkey.');
    return;
  }
  await fetchAdminData();
}

async function fetchAdminData() {
  const modal = document.getElementById('admin-modal');
  if (!modal) return;
  modal.innerHTML = `
    <div style="background:#0e1526;border:1px solid rgba(245,158,11,0.3);border-radius:20px;padding:40px;text-align:center;color:#fff">
      <div style="font-size:36px;animation:spin 1s infinite linear">⏳</div>
      <p style="margin-top:14px;color:#94a3b8">Loading learner accounts and real-time statistics…</p>
    </div>
  `;

  try {
    const res = await fetch((API_BASE || '') + '/api/admin/users?key=' + encodeURIComponent(adminPasskey), {
      headers: {
        ...(authToken ? { 'Authorization': 'Bearer ' + authToken } : {}),
        'x-admin-key': adminPasskey
      }
    });

    if (res.status === 403 || res.status === 401) {
      adminPasskey = '';
      adminCachedData = null;
      renderAdminLoginPrompt('Access denied: Invalid administrator passkey.');
      return;
    }

    if (!res.ok) {
      throw new Error('Server returned status ' + res.status);
    }

    adminCachedData = await res.json();
    renderAdminDashboard();
  } catch (err) {
    modal.innerHTML = `
      <div style="background:#0e1526;border:1px solid rgba(239,68,68,0.4);border-radius:20px;max-width:440px;padding:28px;text-align:center;color:#fff">
        <div style="font-size:40px;margin-bottom:12px">⚠️</div>
        <h3 style="margin:0 0 8px">Unable to Connect to Backend</h3>
        <p style="color:#94a3b8;font-size:13.5px;margin:0 0 20px">Make sure your backend server is running (locally at http://localhost:5000 or on Render) and connected.</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="ghost" onclick="closeAdminModal()">Close</button>
          <button class="primary" onclick="openServerConfigModal()">Configure Server URL</button>
        </div>
      </div>
    `;
  }
}

function viewUserDetail(userId, tab = 'lessons') {
  if (!adminCachedData || !adminCachedData.users) return;
  const u = adminCachedData.users.find(x => x.id === userId);
  if (!u) return;

  adminActiveDetailTab = tab;

  let detailModal = document.getElementById('admin-user-detail-modal');
  if (!detailModal) {
    detailModal = document.createElement('div');
    detailModal.id = 'admin-user-detail-modal';
    detailModal.style.cssText = 'position:fixed;inset:0;background:rgba(4,8,18,0.88);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:9999999;padding:16px';
    detailModal.onclick = (e) => {
      if (e.target === detailModal) closeUserDetailModal();
    };
    document.body.appendChild(detailModal);
  }

  const completedList = (u.completedLessons || []).map(id => {
    const l = typeof LESSONS !== 'undefined' ? LESSONS.find(x => x.id === id) : null;
    return {
      id,
      title: l ? l.title : id,
      level: l ? l.level : '—',
      levelTitle: l ? l.levelTitle : '',
      concept: l ? l.concept : ''
    };
  });

  const challengesList = (u.completedChallenges || []).map(id => {
    const c = typeof CHALLENGES !== 'undefined' ? CHALLENGES.find(x => x.id === id) : null;
    return {
      id,
      title: c ? c.title : id,
      level: c ? c.level : '—',
      description: c ? c.description : ''

  const quizEntries = Object.entries(u.quizResults || {}).map(([lessonId, score]) => {
    const l = typeof LESSONS !== 'undefined' ? LESSONS.find(x => x.id === lessonId) : null;
    const maxScore = l && l.quiz ? l.quiz.length : 2;
    return {
      lessonId,
      score,
      maxScore,
      title: l ? `Level ${l.level} · ${l.title}` : lessonId,
      passed: score >= maxScore

  const notesEntries = Object.entries(u.notes || {})
    .filter(([_, note]) => note && String(note).trim())

      const l = typeof LESSONS !== 'undefined' ? LESSONS.find(x => x.id === lessonId) : null;

function formatBeginnerError(err) {
  const msg = String(err && err.message ? err.message : err).replace(/^Error:\s*/i, '');
  let tip = '';

  if (msg.includes('IndentationError')) {
    if (msg.includes('expected an indented block')) {
      tip = 'You started an if, for, while, or def block, but did not indent the next line. Add 4 spaces at the start of the lines inside the block.';
    } else if (msg.includes('unexpected indent')) {
      tip = "This line has extra spaces at the beginning that shouldn't be there. Align it with the surrounding lines.";
    } else {
      tip = 'Python requires consistent indentation. Always use 4 spaces for each indent level.';
    }
  } else if (msg.includes('SyntaxError')) {
    if (msg.includes("expected ':'") || msg.includes('invalid syntax')) {
      tip = "Check your code structure: did you forget a colon ':' at the end of an if/for/while/def line, or miss a closing parenthesis/bracket?";
    } else if (msg.includes('unterminated') || msg.includes('EOL while scanning')) {
      tip = 'You started a text string with quotes but forgot to close it. Make sure every opening quote has a matching closing quote!';
    } else {
      tip = 'There is a typo or invalid character in this line. Check commas, quotes, and colons.';
    }
  } else if (msg.includes('NameError')) {
    const match = msg.match(/name '([^']+)' is not defined/);
    const varName = match ? match[1] : '';
    tip = varName 
      ? `Python doesn't recognize '${varName}'. Did you misspell it, forget to define it first, or forget quotation marks around it like "${varName}"?`
      : "Python doesn't recognize a word in your code. Check for typos or missing quotation marks around text.";
  } else if (msg.includes('TypeError')) {
    if (msg.includes('can only concatenate') || msg.includes('unsupported operand')) {
      tip = 'You are trying to combine different data types (like text + number). Convert the number using str() or use an f-string like f"Result: {num}".';
    } else if (msg.includes('is not callable')) {
      tip = "You put parentheses () after something that is not a function.";
    } else {
      tip = 'This operation cannot be performed with these data types. Make sure you are passing the right type of value.';
    }
  } else if (msg.includes('ValueError')) {
    tip = 'A function received an inappropriate value (e.g. trying to convert text containing letters with int()).';
  } else if (msg.includes('ZeroDivisionError')) {
    tip = 'Math rule: you cannot divide a number by zero (0). Make sure the denominator is not 0.';
  } else if (msg.includes('IndexError')) {
    tip = 'You tried to access an item position that does not exist. Remember: Python counting starts at 0, so a 3-item list has indexes 0, 1, and 2.';
  } else if (msg.includes('KeyError')) {
    tip = "That key was not found in the dictionary. Check your spelling or use dict.get('key') to provide a default value.";
  } else if (msg.includes('Time limit') || msg.includes('timeout') || msg.includes('Execution stopped')) {
    tip = 'Your program ran longer than the 3-second limit. Check your while or for loops to make sure they have an end condition.';
  }

  return { raw: msg, tip };
}

function generateLessonHint(l) {
  const code = l.code || '';
  const syntax = l.syntax || '';
  if (code.includes('def ')) {
    return 'Define your function with <code>def function_name(param):</code>, indent the body by 4 spaces, and return a result using <code>return</code>.';
  }
  if (code.includes('for ') || code.includes('while ')) {
    return 'Make sure your loop line ends with a colon <code>:</code> and all statements inside the loop are indented with 4 spaces.';
  }
  if (code.includes('if ') || code.includes('elif ')) {
    return 'Remember to put a colon <code>:</code> at the end of your <code>if</code> condition, and indent the code underneath.';
  }
  if (code.includes('input(')) {
    return 'Remember that <code>input("Prompt: ")</code> returns text. To do math with it, wrap it in <code>int()</code> or <code>float()</code>.';
  }
  if (code.includes('[') && code.includes(']')) {
    return 'Lists use square brackets like <code>items = ["apple", "banana"]</code>. You can access items using <code>items[0]</code> or add items with <code>items.append(...)</code>.';
  }
  if (code.includes('{') && code.includes('}')) {
    return 'Dictionaries hold key-value pairs like <code>data = {"name": "Alice", "age": 20}</code>. Access values with <code>data["name"]</code>.';
  }
  if (code.includes('print(')) {
    return 'Call <code>print(...)</code> with your own text inside quotes or variables, like <code>print("My result:", value)</code>.';
  }
  return 'Look at the example code above. Change the values, add a new variable or print statement, and test what happens!';
}

function triggerConfetti(particleCount = 70) {
  let canvas = document.getElementById('confetti-canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'confetti-canvas';
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:999999';
    document.body.appendChild(canvas);
  }
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#7c5cff', '#00f2fe', '#4facfe', '#00e676', '#ffd166', '#ff4081', '#a855f7'];
  const particles = Array.from({ length: particleCount }, () => ({
    x: canvas.width * (0.2 + Math.random() * 0.6),
    y: canvas.height * 0.5,
    vx: (Math.random() - 0.5) * 16,
    vy: -(Math.random() * 14 + 8),
    size: Math.random() * 7 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
    alpha: 1
  }));

  let frame = 0;
  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.38;
      p.vx *= 0.98;
      p.rot += p.vrot;
      if (frame > 40) p.alpha -= 0.02;
      if (p.alpha > 0) {
        alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }
    });
    frame++;
    if (alive && frame < 130) {
      requestAnimationFrame(update);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(update);
}

function gradeQuiz(id){
  const l = lessonById(id);
  const currentQuizList = getActiveQuiz(l);
  let unanswered = false;
  for (let i = 0; i < currentQuizList.length; i++) {
    if (quizSelection[`${id}-${i}`] === undefined) {
      unanswered = true;
      break;
    }
  }
  const resEl = document.getElementById('quiz-result-' + id);
  if (unanswered) {
    if (resEl) {
      resEl.className = 'status bad';
      resEl.textContent = 'Please choose an answer for all questions before checking.';
    }
    return;
  }
  let score = 0;
  currentQuizList.forEach((q, i) => {
    if (quizSelection[`${id}-${i}`] === q.answer) score++;
  });
  quizScore[id] = score;
  state.quizResults[id] = Math.max(state.quizResults[id] ?? -1, score);
  const isPerfect = score === currentQuizList.length;
  if (isPerfect && !state.quizXpAwarded[id]) {
    state.xp += score * 2;
    state.quizXpAwarded[id] = true;
  }
  save();
  if (resEl) {
    resEl.className = 'status ' + (isPerfect ? 'ok' : 'bad');
    resEl.innerHTML = isPerfect 
      ? `<strong>Score: ${score} / ${currentQuizList.length} (100% Correct) 🎉</strong> Mastery check passed! You are ready to mark this lesson mastered.`
      : `<strong>Score: ${score} / ${currentQuizList.length}.</strong> Almost there! Review your answers or click 🔄 Refresh Questions to try the alternate set.`;
  }
  if (isPerfect) {
    triggerConfetti(35);
    showToast('🎉 Mastery Check Passed! 100% Correct', 'ok');
  }
}

function runSkulptInBrowser(code, input = '', timeoutMs = 3000) {
  return new Promise((resolve, reject) => {
    if (typeof Sk === 'undefined') {
      return reject(new Error('Python engine is initializing, please try again in a moment.'));
    }

    let stdout = [];
    const inputLines = (input || '').split('\n');
    let inputIdx = 0;

    Sk.configure({
      output: (str) => stdout.push(str),
      read: (x) => {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles['files'][x] === undefined) {
          throw new Error('File not found: ' + x);
        }
        return Sk.builtinFiles['files'][x];
      },
      inputfun: (prompt) => {
        if (prompt) stdout.push(prompt + '\n');
        return inputIdx < inputLines.length ? inputLines[inputIdx++] : '';
      },
      inputfunTakesPrompt: true,
      execLimit: timeoutMs
    });

    let isDone = false;
    const timer = setTimeout(() => {
      if (!isDone) {
        isDone = true;
        reject(new Error('Execution stopped: Time limit reached (3 seconds).'));
      }
    }, timeoutMs);

    Sk.misceval.asyncToPromise(() => {
      return Sk.importMainWithBody('<stdin>', false, code, true);
    }).then(() => {
      if (isDone) return;
      isDone = true;
      clearTimeout(timer);
      resolve(stdout.join(''));
    }).catch((err) => {
      if (isDone) return;
      isDone = true;
      clearTimeout(timer);
      reject(err);
    });
  });
}

async function executePython(code, input = '', ms = 3000) {
  if (typeof executionEngine !== 'undefined' && executionEngine === 'server' && isCloudOnline) {
    try {
      const res = await fetch(API_BASE + '/api/execute', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(authToken ? { 'Authorization': 'Bearer ' + authToken } : {})
        },
        body: JSON.stringify({ code, stdin: input, timeoutMs: ms })
      });
      const data = await res.json();
      if (data.ok) return data.stdout || '(no output)';
      throw new Error(data.stderr || data.error || 'Execution failed');
    } catch (err) {
      console.warn('Backend execution fallback to in-browser engine:', err.message);
    }
  }

  return runSkulptInBrowser(code, input, ms);
}

async function runChallenge(id){const c=CHALLENGES.find(x=>x.id===id),code=document.getElementById('challengeCode').value,status=document.getElementById('challengeStatus'); status.className='status'; status.textContent='Running tests…'; const results=[]; let firstErr=null; for(const t of c.tests){try{const out=await executePython(code,t.input||'',3000); results.push(out.trim()===t.expected.trim());}catch(err){if(!firstErr)firstErr=err; results.push(false);} } const passed=results.every(Boolean); status.className='status '+(passed?'ok':'bad'); if(passed){status.textContent='All tests passed! Challenge solved. 🎉'; const isNew = !state.completedChallenges.includes(id); if(isNew){state.completedChallenges.push(id);state.xp+=25;save();} showCelebrationModal({ title: 'Challenge Conquered! 🏆', subtitle: `You solved "${c.title}" by passing all test cases!`, xp: isNew ? 25 : 0, nextId: null });} else {let html='Some tests failed. Check your output matches the expected output exactly.'; if(firstErr){const errInfo=formatBeginnerError(firstErr); html+=`<div style="margin-top:8px"><strong>Error:</strong> <code>${esc(errInfo.raw)}</code></div>${errInfo.tip?`<div style="margin-top:8px;padding:8px 12px;background:rgba(124,92,255,0.18);border:1px solid rgba(124,92,255,0.4);border-radius:10px;color:#dcd6ff;font-size:13px">💡 <strong>Beginner Tip:</strong> ${esc(errInfo.tip)}</div>`:''}`;} status.innerHTML=html;}}
function renderProfile(){const el=document.getElementById('view-profile'); const mastered=state.completedLessons.length; const notes=Object.values(state.notes).filter(Boolean).length; const cloudInfo=currentUser?`Signed in as <strong>${esc(currentUser.username)}</strong> (${esc(currentUser.email)}) · 🟢 24/7 Cloud Synchronized with Render`:(isCloudOnline?'🟢 Automatically connected to 24/7 Cloud Backend. Sign in or create an account to sync your progress across devices.':'Connecting to 24/7 Cloud Server… Sign in or create an account to automatically sync your progress.'); const cloudActionBtn=currentUser?`<button class="primary" onclick="openAuthModal()">☁️ Account: ${esc(currentUser.username)}</button>`:`<button class="primary" onclick="openAuthModal()">☁️ Sign In / Create Account</button>`; const adminBanner=(currentUser && currentUser.isAdmin)?`<div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.4);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:26px">👑</span><div><div style="font-weight:700;color:#f59e0b;font-size:14px">Primary Administrator Account (Super Admin)</div><div style="font-size:12.5px;color:#94a3b8">You have full platform privileges, instant 1-click panel access, and student management controls.</div></div></div><div style="display:flex;gap:8px"><button class="ghost small-btn" style="border-color:${adminMasterUnlock?'#f59e0b':'rgba(255,255,255,0.2)'};color:${adminMasterUnlock?'#f59e0b':'#94a3b8'};font-weight:600" onclick="toggleAdminMasterUnlock()">${adminMasterUnlock ? '⚡ God Mode: ON' : '⚡ God Mode: OFF'}</button><button class="primary small-btn" style="background:linear-gradient(135deg,#f59e0b,#ea580c);border:none" onclick="openAdminModal()">Open Admin Panel ➔</button></div></div>`:''; el.innerHTML=`<div class="hero"><div class="eyebrow">Profile & progress</div><h2>Your private learning dashboard.</h2><p>${cloudInfo}</p><div class="toolbar" style="margin-top:14px;gap:10px;flex-wrap:wrap">${cloudActionBtn}<button class="primary" style="background:linear-gradient(135deg,#f59e0b,#ea580c);border:none;color:#fff" onclick="openAdminModal()">👑 Admin Panel</button></div></div>${adminBanner}<div class="grid grid-3"><div class="card"><div class="eyebrow">Mastery</div><h3>${pct(mastered,LESSONS.length)}%</h3><p>${mastered} of ${LESSONS.length} lessons</p></div><div class="card"><div class="eyebrow">Bookmarks</div><h3>${state.bookmarks.length}</h3><p>Lessons saved for review</p></div><div class="card"><div class="eyebrow">Notes</div><h3>${notes}</h3><p>Personal notes stored locally</p></div></div><div class="card" style="margin-top:16px"><div class="eyebrow">Level status</div>${CURRICULUM.map(l=>{const p=levelProgress(+l.id);return `<div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)"><div><strong>Level ${l.id} · ${esc(l.title)}</strong><div class="progress" style="margin-top:8px"><span style="width:${pct(p.done,p.total)}%"></span></div></div><span class="pill">${p.done} / ${p.total}</span></div>`}).join('')}</div><div class="toolbar" style="margin-top:16px"><button class="ghost" onclick="exportProgress()">Export progress</button><button class="ghost" onclick="importProgress()">Import progress</button><button class="danger" onclick="resetProgress()">Reset everything</button></div>`}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='python-academy-progress.json';a.click();URL.revokeObjectURL(a.href)}
function importProgress(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(KEY,String(r.result));state=loadState();save();alert('Progress imported successfully.')}catch{alert('Invalid progress file.')}};r.readAsText(file)};input.click();}
function resetProgress(){if(confirm('Reset all lessons, XP, notes, bookmarks, and challenges?')){localStorage.removeItem(KEY);state=typeof structuredClone === 'function' ? structuredClone(DEFAULT) : JSON.parse(JSON.stringify(DEFAULT));save();go('dashboard')}}
const resetBtnEl=document.getElementById('resetBtn'); if(resetBtnEl) resetBtnEl.onclick=resetProgress;
const globalSearchEl=document.getElementById('globalSearch'); if(globalSearchEl) { globalSearchEl.addEventListener('input',e=>{if(e.target.value.trim()){go('search');renderSearch();} else if(parseRoute().view==='search')go('dashboard')}); }
window.addEventListener('hashchange',renderAll);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus()}});
recordActivity(); renderAll(); checkCloudStatus();
if (!authToken && !currentUser) {
  setTimeout(() => {
    const adminModal = document.getElementById('admin-modal');
    if (!adminModal || adminModal.style.display !== 'flex') {
      openAuthModal();
    }
  }, 400);
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.update();
    } catch (e) {}
  });
}
</script>
</body></html>
