<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Python Academy — a complete personal Python learning environment from foundations to professional projects.">
<link rel="manifest" href="./manifest.json">
<script src="./assets/js/skulpt.min.js"></script>
<script src="./assets/js/skulpt-stdlib.js"></script>
<title>Python Academy</title>
<style>
:root {
  --bg: #0b1020;
  --panel: #11182b;
  --panel2: #161f36;
  --text: #eef4ff;
  --muted: #9aa8c2;
  --border: #232d46;
  --accent: #7c5cff;
  --accent2: #20c997;
  --warn: #f4b942;
  --danger: #ff6b6b;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }

body {
  background: radial-gradient(circle at 15% -10%, #1b2850 0, transparent 35%),
              radial-gradient(circle at 100% 0, #241b4c 0, transparent 30%),
              var(--bg);
  background-attachment: fixed;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--border);
  background: rgba(9, 14, 28, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 22px 16px;
  z-index: 20;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 4px 6px 22px;
}
.logo {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--accent), #38bdf8);
  display: grid;
  place-items: center;
  font-weight: 900;
  box-shadow: 0 10px 30px rgba(124, 92, 255, 0.32);
}
.brand h1 { font-size: 16px; margin: 0; font-weight: 800; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

.nav { display: grid; gap: 6px; flex: 1; overflow-y: auto; }
.nav button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 12px 14px;
  border-radius: 12px;
  text-align: left;
  display: flex;
  gap: 12px;
  align-items: center;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s ease, color 0.15s ease;
  min-height: 44px;
}
.nav button:hover, .nav button.active {
  background: #171f35;
  color: var(--text);
}
.nav button.active {
  border-left: 3px solid var(--accent);
  border-top-left-radius: 4px;
  border-bottom-left-radius: 4px;
}

.sidebar-foot {
  padding: 16px 8px 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(11, 16, 32, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.topbar .title { font-weight: 800; font-size: 18px; white-space: nowrap; }
.actions { display: flex; gap: 8px; align-items: center; }

.icon-btn, .small-btn, .primary, .ghost, .danger {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 14px;
  background: var(--panel);
  color: var(--text);
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
  min-height: 38px;
}
.primary {
  background: linear-gradient(135deg, var(--accent), #6651e8);
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(124, 92, 255, 0.28);
}
.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.ghost { background: transparent; }
.ghost:hover { background: rgba(255, 255, 255, 0.05); }
.danger { color: #ff9a9a; background: transparent; border-color: rgba(255, 107, 107, 0.3); }
.danger:hover { background: rgba(255, 107, 107, 0.1); }

.container {
  max-width: 1260px;
  width: 100%;
  margin: 0 auto;
  padding: 26px 28px 100px;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

.hero {
  padding: 26px;
  border: 1px solid var(--border);
  background: linear-gradient(145deg, rgba(124, 92, 255, 0.14), rgba(32, 201, 151, 0.04) 55%, rgba(255, 255, 255, 0.01));
  border-radius: 22px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.eyebrow {
  color: #b9a7ff;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 11px;
  font-weight: 800;
}
h2 {
  margin: 8px 0 10px;
  font-size: clamp(24px, 3.8vw, 40px);
  line-height: 1.15;
  font-weight: 800;
}
h3 { margin: 0 0 8px; font-size: 18px; }
p { color: var(--muted); line-height: 1.7; margin: 0 0 10px; }

/* Responsive stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  margin: 18px 0 24px;
}
.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  min-width: 0;
}
.stat .n { font-size: clamp(20px, 4vw, 26px); font-weight: 900; }
.stat .l { color: var(--muted); font-size: 12px; margin-top: 4px; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

.card {
  background: rgba(17, 24, 43, 0.84);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
}
.card.clickable:hover {
  border-color: #40517a;
  transform: translateY(-1px);
}

.progress {
  height: 8px;
  background: #202a42;
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
}
.progress > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  background: #19233d;
  color: #bcc9e7;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.lock { opacity: 0.55; }

.level-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
}
.level-num {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: 14px;
  background: #1a2440;
  display: grid;
  place-items: center;
  font-weight: 900;
  color: #b8a8ff;
  font-size: 16px;
}
.lesson-list { display: grid; gap: 8px; margin-top: 14px; }
.lesson-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #0f1628;
  min-height: 48px;
}
.lesson-row.done { border-color: #254f47; background: #10231f; }
.lesson-row button {
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  padding: 0;
  font-size: 14px;
  word-break: break-word;
}
.check {
  width: 24px;
  height: 24px;
  min-width: 24px;
  border-radius: 50%;
  border: 1px solid #40506c;
  display: grid;
  place-items: center;
  font-size: 11px;
}
.done .check { background: #1f9d7a; border-color: #1f9d7a; color: #fff; }

.search {
  width: clamp(140px, 25vw, 320px);
  background: #0f1628;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 12px;
  outline: none;
  font-size: 14px;
  transition: width 0.2s ease, border-color 0.15s ease;
}
.search:focus, textarea:focus, input:focus { border-color: #7c5cff; }

/* Lesson Wrap: Fluid columns avoiding intermediate breakpoint overflow */
.lesson-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 20px;
  align-items: start;
}
.lesson-main, .lesson-side {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  min-width: 0;
}
.lesson-main h1 {
  font-size: clamp(24px, 3.5vw, 38px);
  margin: 8px 0 14px;
  line-height: 1.2;
}
.hook {
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  background: #151d34;
  border-radius: 0 12px 12px 0;
  margin: 18px 0;
}
.section { margin-top: 24px; min-width: 0; }
.section h3 { font-size: 16px; }
pre {
  margin: 12px 0;
  padding: 16px;
  border-radius: 14px;
  background: #0a0f1c;
  border: 1px solid #202a41;
  overflow-x: auto;
  line-height: 1.55;
  max-width: 100%;
}
code { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 13.5px; }
.explain { white-space: pre-wrap; color: #d8e1f3; line-height: 1.7; word-break: break-word; }
.checklist { display: grid; gap: 8px; }
.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  background: #0f1628;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px 14px;
  border-radius: 12px;
  margin-top: 8px;
  min-height: 46px;
  line-height: 1.4;
}
.quiz-opt.selected { border-color: #6d5eea; background: #1a2142; }
.quiz-opt.correct { border-color: #1d9f7c; background: #102e28; }
.quiz-opt.wrong { border-color: #cf5b5b; background: #2f181b; }

.lab {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 16px;
}
textarea.editor {
  width: 100%;
  min-height: 400px;
  resize: vertical;
  background: #090e18;
  color: #dce7fb;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 14px;
  line-height: 1.55;
  outline: none;
  tab-size: 4;
}
.lab-output {
  min-height: 400px;
  max-height: 550px;
  background: #090e18;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  white-space: pre-wrap;
  overflow: auto;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 14px;
  color: #dce7fb;
}
.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 10px 0;
}
.toolbar .spacer { flex: 1; }

.challenge {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 16px;
}
.testcase {
  padding: 12px 14px;
  background: #0e1525;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-top: 8px;
  word-break: break-word;
}
.status {
  padding: 11px 14px;
  border-radius: 12px;
  background: #121a2d;
  border: 1px solid var(--border);
  font-size: 13.5px;
  line-height: 1.5;
  word-break: break-word;
}
.status.ok { border-color: #266653; background: #10271f; }
.status.bad { border-color: #70414a; background: #2d151a; }

.mobile-nav { display: none; }
.empty { text-align: center; padding: 44px; color: var(--muted); }
.kbd {
  border: 1px solid var(--border);
  background: #141c30;
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 11px;
}

/* Modal styles for Auth and Cloud Sync */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 7, 15, 0.78);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}
.modal-card {
  background: #11182b;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.modal-header h3 { margin: 0; font-size: 18px; }
.close-btn {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 18px;
  padding: 4px;
}
.modal-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.modal-tabs button {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0c1322;
  color: var(--muted);
  font-weight: 600;
}
.modal-tabs button.active {
  background: #1b2646;
  border-color: var(--accent);
  color: #fff;
}
.form-group {
  margin-bottom: 14px;
}
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  background: #090e18;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 14px;
  outline: none;
}

/* Tablet & Intermediate Viewports */
@media (max-width: 1080px) {
  .lesson-wrap { grid-template-columns: 1fr; }
  .lesson-side { order: -1; }
}

@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .container {
    padding: 18px 16px calc(80px + env(safe-area-inset-bottom, 0px));
  }
  .topbar { padding: 12px 16px; }
  .challenge, .lab { grid-template-columns: 1fr; }
  .mobile-nav {
    position: fixed;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(62px + env(safe-area-inset-bottom, 0px));
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(10, 15, 29, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    z-index: 100;
  }
  .mobile-nav button {
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 10.5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 2px;
    border-radius: 8px;
    min-height: 48px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mobile-nav button.active { color: #fff; background: rgba(124, 92, 255, 0.15); }
  .mobile-nav span { display: block; font-size: 18px; margin-bottom: 2px; }
}

/* Mobile Screens (< 560px) */
@media (max-width: 560px) {
  h2 { font-size: 26px; }
  .hero, .card, .lesson-main, .lesson-side { padding: 15px; border-radius: 16px; }
  .topbar { padding: 10px 12px; gap: 8px; }
  .topbar .title { display: none; }
  .actions { width: 100%; justify-content: space-between; }
  .search { flex: 1; min-width: 110px; max-width: none; }
  .cloud-text { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { padding: 12px; }
  .stat .n { font-size: 20px; }
  .stat .l { font-size: 11px; }
  .level-card {
    grid-template-columns: auto 1fr;
    gap: 12px;
  }
  .level-card button {
    grid-column: 1 / -1;
    justify-self: stretch;
    text-align: center;
    padding: 12px;
  }
  .lesson-row { padding: 10px 12px; gap: 10px; }
  textarea.editor, .lab-output { min-height: 270px; font-size: 16px; }
  input, textarea { font-size: 16px !important; }
}

@media (max-width: 350px) {
  .stats { grid-template-columns: 1fr; }
  .mobile-nav button { font-size: 9px; }
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">Py</div><div><h1>Python Academy</h1><p>Learn • Practice • Build</p></div></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-foot">Personal learning mode<br><span class="muted">Your data stays in this browser.</span></div>
</aside>
<main class="main">
  <header class="topbar">
  <div class="title" id="pageTitle">Dashboard</div>
  <div class="actions">
    <input id="globalSearch" class="search" placeholder="Search lessons…" aria-label="Search lessons">
    <button class="icon-btn" id="adminBtn" onclick="openAdminModal()" title="Admin Panel" style="border-color:rgba(245,158,11,0.4);color:#f59e0b">
      👑 <span class="cloud-text">Admin</span>
    </button>
    <button class="icon-btn" id="cloudBtn" onclick="openAuthModal()" title="Cloud Account & Sync">
      <span id="cloudDot" style="color:#20c997">●</span> <span id="cloudUserText" class="cloud-text">Cloud Sync</span>
    </button>
    <button class="icon-btn" id="resetBtn" title="Reset local progress">↺</button>
  </div>
</header>
  <div class="container">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-learn"></section>
    <section class="view" id="view-lesson"></section>
    <section class="view" id="view-lab"></section>
    <section class="view" id="view-challenges"></section>
    <section class="view" id="view-profile"></section>
    <section class="view" id="view-search"></section>
  </div>

  <div id="authModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeAuthModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Cloud Account & Sync</h3>
        <button class="close-btn" onclick="closeAuthModal()">✕</button>
      </div>
      <div id="authModalBody"></div>
    </div>
  </div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

const LESSONS = [{"objective":"Understand how instructions, programs, input, output, and errors fit together.","why":"You will use computers & programs when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand how instructions, programs, input, output, and errors fit together. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Computers & Programs\n\n# Write the smallest working example first.","code":"print(\"Hello, Python!\")","explanation":"Python executes instructions in order unless control flow changes that order. Think of a program as a precise list of instructions.","mistakes":["Using Computers & Programs mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see \"Hello, Python!\". Then change the text inside quotes to your name or greeting (e.g. print(\"Hello, Alex!\")) and click Run practice.","quiz":[{"q":"Which Python function displays text or numbers on the screen?","options":["input()","print()","show()","echo()"],"answer":1},{"q":"How do you represent a text string in Python?","options":["Inside angle brackets <Hello>","Inside dollar signs $Hello$","Inside quotes like \"Hello\"","With no quotes"],"answer":2}],"id":"L0_1","level":0,"levelTitle":"Programming Foundations","order":1,"title":"Computers & Programs"},{"objective":"Learn what data is and how programs represent numbers, text, and true/false values.","why":"You will use values & data when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Learn what data is and how programs represent numbers, text, and true/false values. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Values & Data\n\n# Write the smallest working example first.","code":"age = 18\nname = \"Rohith\"\nactive = True\nprint(age, name, active)","explanation":"Python values have types. Numbers can be calculated, strings represent text, and booleans represent truth values.","mistakes":["Using Values & Data mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see Python data types. Try printing the type of your favorite number like type(100) or decimal like type(9.99).","quiz":[{"q":"What data type is the whole number 42 in Python?","options":["int (integer)","float","str (string)","bool (boolean)"],"answer":0},{"q":"Which of these represents a True or False value?","options":["str","bool","int","list"],"answer":1}],"id":"L0_2","level":0,"levelTitle":"Programming Foundations","order":2,"title":"Values & Data"},{"objective":"Understand names, assignment, and how program state changes.","why":"You will use variables & state when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand names, assignment, and how program state changes. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Variables & State\n\n# Write the smallest working example first.","code":"score = 10\nscore = score + 5\nprint(score)","explanation":"Assignment binds a name to a value. Reassigning a name changes what that name refers to.","mistakes":["Using Variables & State mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see the score change. Try changing the starting score to 50, or increase it by 10 instead of 5.","quiz":[{"q":"How do you create a variable called score and set it to 10?","options":["var score := 10","int score == 10","set score to 10","score = 10"],"answer":3},{"q":"What happens when you reassign an existing variable with a new value?","options":["The variable updates to store the new value","Python throws a syntax error","Both values are merged","The computer reboots"],"answer":0}],"id":"L0_3","level":0,"levelTitle":"Programming Foundations","order":3,"title":"Variables & State"},{"objective":"Build expressions with arithmetic, comparison, and logical operators.","why":"You will use expressions & operators when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build expressions with arithmetic, comparison, and logical operators. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Expressions & Operators\n\n# Write the smallest working example first.","code":"a = 10\nb = 3\nprint(a + b)\nprint(a > b)\nprint(a > 5 and b < 5)","explanation":"Expressions produce values. Operators combine or transform values so you can calculate, compare, and make logical decisions.","mistakes":["Using Expressions & Operators mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see math calculations. Try calculating 25 * 4 or 100 - 35 in a new print() statement.","quiz":[{"q":"What symbol is used for multiplication in Python?","options":["x","•","*","^"],"answer":2},{"q":"What is the result of 10 + 2 * 3 in Python?","options":["36","24","15","16 (multiplication happens before addition)"],"answer":3}],"id":"L0_4","level":0,"levelTitle":"Programming Foundations","order":4,"title":"Expressions & Operators"},{"objective":"Read user input and present useful output with formatting.","why":"You will use input & output when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Read user input and present useful output with formatting. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Input & Output\n\n# Write the smallest working example first.","code":"name = input(\"Name: \")\nage = int(input(\"Age: \"))\nprint(f\"Hello {name}, next year you will be {age + 1}.\")","explanation":"input() returns text. Convert numeric input explicitly, then use formatted output to make the result easy to read.","mistakes":["Using Input & Output mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code and enter your name in the input box below. Try changing the greeting message!","quiz":[{"q":"Which function is used to capture user keyboard input?","options":["read()","input()","scan()","get()"],"answer":1},{"q":"What type of data does the input() function return by default?","options":["int (integer)","bool (boolean)","str (string / text)","float (decimal)"],"answer":2}],"id":"L0_5","level":0,"levelTitle":"Programming Foundations","order":5,"title":"Input & Output"},{"objective":"Turn a problem into clear, ordered steps before coding.","why":"You will use algorithms & pseudocode when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Turn a problem into clear, ordered steps before coding. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Algorithms & Pseudocode\n\n# Write the smallest working example first.","code":"# Pseudocode:\n# read number\n# if even -> say even\n# otherwise -> say odd\n\nn = int(input(\"Number: \"))\nprint(\"Even\" if n % 2 == 0 else \"Odd\")","explanation":"Pseudocode is a design tool. It lets you focus on the solution steps before worrying about exact syntax.","mistakes":["Using Algorithms & Pseudocode mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the step-by-step instructions. Try adding a 4th step printing \"Step 4: Practice complete!\".","quiz":[{"q":"What is an algorithm in computer programming?","options":["A step-by-step set of instructions to solve a problem","A type of computer hardware","A programming error","A secret password"],"answer":0},{"q":"Why is planning with pseudocode helpful before coding?","options":["It makes Python execute faster","It clarifies the logic before worrying about exact syntax","It replaces the need for testing","It is required by the computer"],"answer":1}],"id":"L0_6","level":0,"levelTitle":"Programming Foundations","order":6,"title":"Algorithms & Pseudocode"},{"objective":"Identify syntax, runtime, and logic errors systematically.","why":"You will use debugging mindset when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Identify syntax, runtime, and logic errors systematically. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Debugging Mindset\n\n# Write the smallest working example first.","code":"total = 0\nfor value in [2, 4, 6]:\n    total += value\nprint(total)","explanation":"Debugging is evidence-driven: reproduce the problem, inspect values, isolate the cause, make one change, and retest.","mistakes":["Using Debugging Mindset mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to verify it runs without errors. Try printing an extra celebratory message!","quiz":[{"q":"What is debugging in programming?","options":["Deleting the entire program","Buying a new computer","Turning off the monitor","Finding and fixing mistakes or bugs in your code"],"answer":3},{"q":"When Python shows an error message, what should you do first?","options":["Read the error type and line number carefully","Guess randomly and change unrelated lines","Close the editor immediately","Ignore the message"],"answer":0}],"id":"L0_7","level":0,"levelTitle":"Programming Foundations","order":7,"title":"Debugging Mindset"},{"objective":"Combine the foundations into a small interactive program.","why":"You will use first mini program when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Combine the foundations into a small interactive program. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# First Mini Program\n\n# Write the smallest working example first.","code":"name = input(\"Your name: \")\ncity = input(\"Your city: \")\nprint(f\"Profile: {name} from {city}\")","explanation":"A small program becomes meaningful when it accepts input, stores state, applies logic, and communicates a result clearly.","mistakes":["Using First Mini Program mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run your first mini program! Change the variables (like user name or score) to make it personal to you.","quiz":[{"q":"What is a key benefit of combining variables and print() statements?","options":["It encrypts your code","It prevents all errors permanently","You can create dynamic programs that display personalized results","It makes Python run backwards"],"answer":2},{"q":"What character indicates a single-line comment in Python?","options":["//","/*","<!--","#"],"answer":3}],"id":"L0_8","level":0,"levelTitle":"Programming Foundations","order":8,"title":"First Mini Program"},{"objective":"Learn indentation, statements, comments, and Python style basics.","why":"You will use python syntax when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Learn indentation, statements, comments, and Python style basics. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Indentation defines blocks\nname = \"Rohith\"\nif name:\n    print(f\"Hello, {name}!\")","code":"# Indentation defines blocks\nname = \"Rohith\"\nif name:\n    print(f\"Hello, {name}!\")","explanation":"Python uses indentation to define blocks. Consistent four-space indentation is the normal convention; a missing or extra indentation level changes program structure.","mistakes":["Using Python Syntax mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see Python syntax. Try adding a second print(\"I am learning Python!\") statement.","quiz":[{"q":"How does Python determine which lines belong inside a code block?","options":["Curly braces {}","Indentation (spaces at the start of lines)","Semicolons ;","Parentheses ()"],"answer":1},{"q":"How many spaces are standard for each indentation level in Python?","options":["1 space","10 spaces","4 spaces","8 spaces"],"answer":2}],"id":"L1_1","level":1,"levelTitle":"Python Fundamentals","order":1,"title":"Python Syntax"},{"objective":"Work confidently with numeric and string values.","why":"You will use numbers & strings when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Work confidently with numeric and string values. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"price = 1499\nquantity = 2\nlabel = \"Keyboard\"\nprint(label, price * quantity)","code":"price = 1499\nquantity = 2\nlabel = \"Keyboard\"\nprint(label, price * quantity)","explanation":"Integers and floats are numeric values; strings are text. Keep them conceptually separate and convert deliberately when combining user input with calculations.","mistakes":["Using Numbers & Strings mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see number and string operations. Try changing the numbers or combining your own words.","quiz":[{"q":"What is the difference between 5 and \"5\" in Python?","options":["5 is an integer (number), while \"5\" is a string (text)","They are completely identical","\"5\" is a float","5 is invalid syntax"],"answer":0},{"q":"What happens when you add two strings: \"Py\" + \"thon\"?","options":["Error","\"Python\" (concatenation)","0","\"Py thon\""],"answer":1}],"id":"L1_2","level":1,"levelTitle":"Python Fundamentals","order":2,"title":"Numbers & Strings"},{"objective":"Transform, search, split, join, and format text.","why":"You will use string methods when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Transform, search, split, join, and format text. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# String Methods\n\n# Write the smallest working example first.","code":"text = \"  python academy  \"\nclean = text.strip().title()\nprint(clean)\nprint(clean.replace(\"Academy\", \"Course\"))","explanation":"String methods return new strings. Common tools include strip(), lower(), upper(), title(), replace(), split(), and join().","mistakes":["Using String Methods mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see variable updates. Try creating a new variable like greeting = \"Welcome\" and printing it.","quiz":[{"q":"Which string method converts all letters to uppercase?","options":[".capitalize()",".toUpper()",".big()",".upper()"],"answer":3},{"q":"What does the .strip() method do to a string?","options":["Removes leading and trailing whitespace","Reverses the string","Deletes all vowels","Counts the words"],"answer":0}],"id":"L1_3","level":1,"levelTitle":"Python Fundamentals","order":3,"title":"String Methods"},{"objective":"Convert between common Python types safely.","why":"You will use type conversion when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Convert between common Python types safely. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Type Conversion\n\n# Write the smallest working example first.","code":"text = \"42\"\nnumber = int(text)\nprint(number + 8)\nprint(str(number))","explanation":"Conversion is explicit and predictable: int(\"42\") creates an integer, while str(42) creates text. Not every string is a valid integer.","mistakes":["Using Type Conversion mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see type conversion with int() and str(). Try converting a new string number like \"50\" into an integer.","quiz":[{"q":"How do you convert the text string \"25\" into a number for math?","options":["str(25)","to_number(\"25\")","int(\"25\")","parse(\"25\")"],"answer":2},{"q":"What happens if you try to convert int(\"hello\")?","options":["It converts to 0","It ignores the letters","It converts to 100","Python raises a ValueError"],"answer":3}],"id":"L1_4","level":1,"levelTitle":"Python Fundamentals","order":4,"title":"Type Conversion"},{"objective":"Use comparisons and truth values in decisions.","why":"You will use booleans & comparisons when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use comparisons and truth values in decisions. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"age = 18\nprint(age >= 18)\nprint(age < 13 or age > 60)","code":"age = 18\nprint(age >= 18)\nprint(age < 13 or age > 60)","explanation":"Comparison operators return booleans. Combine boolean expressions with and, or, and not to express rules clearly.","mistakes":["Using Booleans & Comparisons mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see string methods like .upper(). Try converting your favorite city or food to uppercase!","quiz":[{"q":"Which operator checks if two values are equal in Python?","options":["=","==","!=","==="],"answer":1},{"q":"What does 10 >= 10 evaluate to?","options":["False","None","True","Error"],"answer":2}],"id":"L1_5","level":1,"levelTitle":"Python Fundamentals","order":5,"title":"Booleans & Comparisons"},{"objective":"Understand strings, lists, tuples, and indexing.","why":"You will use sequences overview when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand strings, lists, tuples, and indexing. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"text = \"Python\"\nitems = [10, 20, 30]\npoint = (4, 7)\nprint(text[0], items[-1], point[1])","code":"text = \"Python\"\nitems = [10, 20, 30]\npoint = (4, 7)\nprint(text[0], items[-1], point[1])","explanation":"Strings, lists, and tuples are ordered sequences. They support indexing and slicing, while mutability differs between lists and tuples/strings.","mistakes":["Using Sequences Overview mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see f-string formatting. Try writing an f-string with your own name and favorite hobby.","quiz":[{"q":"What index does Python use for the very first item of a sequence?","options":["0","1","-1","first"],"answer":0},{"q":"Which function returns the total number of characters in a string or items in a list?","options":["size()","len()","count()","total()"],"answer":1}],"id":"L1_6","level":1,"levelTitle":"Python Fundamentals","order":6,"title":"Sequences Overview"},{"objective":"Create readable, professional output with f-strings.","why":"You will use formatting & f-strings when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Create readable, professional output with f-strings. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"name = \"Rohith\"\nscore = 92\nprint(f\"{name} scored {score}%\")\nprint(f\"Average: {18/5:.2f}\")","code":"name = \"Rohith\"\nscore = 92\nprint(f\"{name} scored {score}%\")\nprint(f\"Average: {18/5:.2f}\")","explanation":"f-strings place expressions inside braces and support format specifications such as .2f for two decimal places.","mistakes":["Using Formatting & f-strings mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code. Try adding a comment starting with # explaining what line 1 does, then run it again.","quiz":[{"q":"How do you format variables into text using an f-string?","options":["\"Hello, {name}!\"","f\"Hello, [name]!\"","format(\"Hello\", name)","f\"Hello, {name}!\""],"answer":3},{"q":"What prefix letter is placed before quotes to create an f-string?","options":["f or F","s","str","$"],"answer":0}],"id":"L1_7","level":1,"levelTitle":"Python Fundamentals","order":7,"title":"Formatting & f-strings"},{"objective":"Build a small profile and bill calculator using core Python.","why":"You will use fundamentals project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build a small profile and bill calculator using core Python. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"name = input(\"Name: \")\nitem = input(\"Favorite Python topic: \")\nprint(f\"{name} likes {item}.\")","code":"name = input(\"Name: \")\nitem = input(\"Favorite Python topic: \")\nprint(f\"{name} likes {item}.\")","explanation":"Combine input, variables, strings, and formatting into a tiny program. Keep the data flow easy to follow.","mistakes":["Using Fundamentals Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the foundations project. Customize the printed details with your own personal statistics!","quiz":[{"q":"Why is writing modular, well-named code important?","options":["It makes the file size larger","It is required by the operating system","It makes code easier for humans to read, debug, and maintain","It hides code from users"],"answer":2},{"q":"What is a good way to test that your program works as expected?","options":["Assume it works without running it","Delete the comments","Change random lines","Run it with different sample inputs and verify the output"],"answer":3}],"id":"L1_8","level":1,"levelTitle":"Python Fundamentals","order":8,"title":"Fundamentals Project"},{"objective":"Make programs choose between paths.","why":"You will use if / elif / else when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Make programs choose between paths. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# if / elif / else\n\n# Write the smallest working example first.","code":"score = 72\nif score >= 90:\n    grade = \"A\"\nelif score >= 60:\n    grade = \"B\"\nelse:\n    grade = \"C\"\nprint(grade)","explanation":"Python checks branches from top to bottom. The first true branch runs and the remaining branches are skipped.","mistakes":["Using if / elif / else mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see True and False comparison results. Try checking if 15 > 10 or if 50 == 50.","quiz":[{"q":"Which keyword is used to test an alternative condition if the first if is False?","options":["else if","elif","elseif","then"],"answer":1},{"q":"What character must follow every if, elif, and else line?","options":["; (semicolon)","{ (brace)",": (colon)",", (comma)"],"answer":2}],"id":"L2_1","level":2,"levelTitle":"Control Flow","order":1,"title":"if / elif / else"},{"objective":"Build multi-step decision logic without losing clarity.","why":"You will use nested decisions when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build multi-step decision logic without losing clarity. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"age = 20\nhas_id = True\nif age >= 18:\n    if has_id:\n        print(\"Entry allowed\")\n    else:\n        print(\"Bring ID\")\nelse:\n    print(\"Too young\")","code":"age = 20\nhas_id = True\nif age >= 18:\n    if has_id:\n        print(\"Entry allowed\")\n    else:\n        print(\"Bring ID\")\nelse:\n    print(\"Too young\")","explanation":"Nested decisions are useful when one rule depends on another. Keep nesting shallow and extract logic into variables or functions when it becomes hard to read.","mistakes":["Using Nested Decisions mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see if/else branching. Try changing the score or age variable to see a different branch execute.","quiz":[{"q":"What is a nested decision in Python?","options":["An if statement placed inside another if statement","A decision with no conditions","A loop that never runs","An error in syntax"],"answer":0},{"q":"How many indentation levels does the body of a nested if statement have?","options":["1 level (4 spaces)","2 levels (8 spaces)","0 levels","3 spaces"],"answer":1}],"id":"L2_2","level":2,"levelTitle":"Control Flow","order":2,"title":"Nested Decisions"},{"objective":"Repeat actions over sequences and ranges.","why":"You will use for loops when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Repeat actions over sequences and ranges. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# for Loops\n\n# Write the smallest working example first.","code":"total = 0\nfor n in range(1, 6):\n    total += n\nprint(total)","explanation":"for loops iterate over items. range(1, 6) produces 1 through 5, so the loop body runs five times.","mistakes":["Using for Loops mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code using and, or, not. Try changing the boolean values to see how the condition evaluates.","quiz":[{"q":"What does range(3) generate in a for loop?","options":["1, 2, 3","0, 1, 2, 3","3, 2, 1","0, 1, 2"],"answer":3},{"q":"Which loop is best when you know in advance how many items to process?","options":["for loop","while loop","do-while loop","infinite loop"],"answer":0}],"id":"L2_3","level":2,"levelTitle":"Control Flow","order":3,"title":"for Loops"},{"objective":"Repeat until a condition changes.","why":"You will use while loops when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Repeat until a condition changes. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# while Loops\n\n# Write the smallest working example first.","code":"attempts = 0\nwhile attempts < 3:\n    print(\"Attempt\", attempts + 1)\n    attempts += 1","explanation":"while repeats while its condition stays true. Always make sure something inside the loop can eventually make the condition false.","mistakes":["Using while Loops mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the while loop. Try changing the loop limit to count up to 10 instead of 5.","quiz":[{"q":"When does a while loop stop repeating?","options":["After exactly 10 runs","When the computer runs out of memory","When its condition evaluates to False","It never stops"],"answer":2},{"q":"What happens if a while loop condition never becomes False?","options":["Python automatically exits after 1 second","The program deletes itself","A syntax error appears","An infinite loop occurs"],"answer":3}],"id":"L2_4","level":2,"levelTitle":"Control Flow","order":4,"title":"while Loops"},{"objective":"Control loop execution precisely.","why":"You will use break & continue when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Control loop execution precisely. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"for n in range(1, 8):\n    if n == 3:\n        continue\n    if n == 6:\n        break\n    print(n)","code":"for n in range(1, 8):\n    if n == 3:\n        continue\n    if n == 6:\n        break\n    print(n)","explanation":"continue skips the current iteration; break exits the loop completely. Use both to express clear loop control, not to hide complicated logic.","mistakes":["Using break & continue mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the for loop. Try changing range(5) to range(1, 11) to print numbers 1 through 10.","quiz":[{"q":"Which keyword immediately exits and stops the current loop?","options":["continue","break","pass","stop"],"answer":1},{"q":"Which keyword skips the rest of the current iteration and moves to the next one?","options":["break","skip","continue","next"],"answer":2}],"id":"L2_5","level":2,"levelTitle":"Control Flow","order":5,"title":"break & continue"},{"objective":"Master counters, accumulators, flags, and validation loops.","why":"You will use loop patterns when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Master counters, accumulators, flags, and validation loops. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"numbers = [3, 7, 2, 9]\ntotal = 0\ncount = 0\nfor n in numbers:\n    if n > 5:\n        total += n\n        count += 1\nprint(total, count)","code":"numbers = [3, 7, 2, 9]\ntotal = 0\ncount = 0\nfor n in numbers:\n    if n > 5:\n        total += n\n        count += 1\nprint(total, count)","explanation":"Accumulators build a result, counters track frequency, and flags remember whether a condition was seen. These patterns appear everywhere in problem solving.","mistakes":["Using Loop Patterns mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see break and continue. Try changing the target number where the loop stops.","quiz":[{"q":"What is an accumulator variable in a loop pattern?","options":["A variable that gathers or sums up values as the loop runs","A loop that runs backwards","An error counter","A type of list"],"answer":0},{"q":"How can you keep track of both the index and item in a for loop?","options":["Using count(items)","Using enumerate(items)","Using index(items)","Using loop(items)"],"answer":1}],"id":"L2_6","level":2,"levelTitle":"Control Flow","order":6,"title":"Loop Patterns"},{"objective":"Combine decisions and loops to solve small problems.","why":"You will use pattern practice when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Combine decisions and loops to solve small problems. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"text = \"hello world\"\nvowels = 0\nfor ch in text.lower():\n    if ch in \"aeiou\":\n        vowels += 1\nprint(vowels)","code":"text = \"hello world\"\nvowels = 0\nfor ch in text.lower():\n    if ch in \"aeiou\":\n        vowels += 1\nprint(vowels)","explanation":"Combine loops with conditionals to transform a problem statement into a repeatable decision pattern.","mistakes":["Using Pattern Practice mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the nested code. Try changing the loop numbers to print a different multiplication or grid pattern.","quiz":[{"q":"Why is testing loop boundary conditions (like 0 or empty lists) important?","options":["Loops fail on large numbers","Python requires boundary tests to compile","It makes loops run twice as fast","Off-by-one errors and empty edge cases are common source of bugs"],"answer":3},{"q":"What does pass do in an if statement or loop body?","options":["Acts as a placeholder that does nothing","Exits the program","Prints \"pass\"","Restarts the loop"],"answer":0}],"id":"L2_7","level":2,"levelTitle":"Control Flow","order":7,"title":"Pattern Practice"},{"objective":"Create a menu-driven number toolkit.","why":"You will use control flow project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Create a menu-driven number toolkit. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"while True:\n    choice = input(\"1) square  2) quit: \")\n    if choice == \"2\":\n        break\n    if choice == \"1\":\n        n = int(input(\"Number: \"))\n        print(n * n)\n    else:\n        print(\"Invalid choice\")","code":"while True:\n    choice = input(\"1) square  2) quit: \")\n    if choice == \"2\":\n        break\n    if choice == \"1\":\n        n = int(input(\"Number: \"))\n        print(n * n)\n    else:\n        print(\"Invalid choice\")","explanation":"A menu-driven loop is a compact way to combine validation, branching, repetition, and clean program exit.","mistakes":["Using Control Flow Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the control flow project. Try changing the test values or conditions to see how the program responds.","quiz":[{"q":"What makes a program interactive?","options":["Having lots of comments","Using only print statements","Responding to user inputs with conditional decisions and loops","Running in the background"],"answer":2},{"q":"What is a good way to structure a text-based menu loop?","options":["A single if statement","Ten nested for loops","A list of strings with no loop","A while loop that keeps running until the user enters an exit choice"],"answer":3}],"id":"L2_8","level":2,"levelTitle":"Control Flow","order":8,"title":"Control Flow Project"},{"objective":"Store and manipulate ordered collections.","why":"You will use lists when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Store and manipulate ordered collections. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Lists\n\n# Write the smallest working example first.","code":"names = [\"Asha\", \"Ravi\", \"Mina\"]\nprint(names[0])\nnames.append(\"Zara\")\nprint(names)","explanation":"Lists are mutable ordered collections. Indexing starts at zero, and methods such as append() change the list in place.","mistakes":["Using Lists mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to call the function. Try calling greet() with a different friend’s name!","quiz":[{"q":"Which brackets are used to define a list in Python?","options":["Curly braces {}","Square brackets []","Parentheses ()","Angle brackets <>"],"answer":1},{"q":"What is the index of the last element in a Python list?","options":["0","last","-1","100"],"answer":2}],"id":"L3_1","level":3,"levelTitle":"Data Structures","order":1,"title":"Lists"},{"objective":"Add, remove, sort, reverse, and search list data.","why":"You will use list methods when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Add, remove, sort, reverse, and search list data. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"items = [3, 1, 4]\nitems.append(2)\nitems.sort()\nitems.remove(3)\nprint(items)","code":"items = [3, 1, 4]\nitems.append(2)\nitems.sort()\nitems.remove(3)\nprint(items)","explanation":"List methods change a mutable list. Know which methods mutate in place and which operations create a new result.","mistakes":["Using List Methods mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the function with parameters. Try passing two different numbers to see their combined result.","quiz":[{"q":"Which method adds a single item to the end of a list?","options":[".append()",".add()",".push()",".insert_last()"],"answer":0},{"q":"Which method removes and returns the last item from a list?","options":[".remove()",".pop()",".delete()",".shift()"],"answer":1}],"id":"L3_2","level":3,"levelTitle":"Data Structures","order":2,"title":"List Methods"},{"objective":"Use immutable grouped data and unpacking.","why":"You will use tuples when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use immutable grouped data and unpacking. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"point = (10, 20)\nx, y = point\nprint(x, y)","code":"point = (10, 20)\nx, y = point\nprint(x, y)","explanation":"Tuples are ordered and immutable. Tuple unpacking makes grouped return values and fixed records easy to work with.","mistakes":["Using Tuples mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see return values. Try saving the returned answer in a variable and printing it.","quiz":[{"q":"What is the main difference between a list and a tuple?","options":["Tuples cannot store numbers","Tuples use square brackets","Lists are faster than tuples","Tuples are immutable (cannot be changed after creation)"],"answer":3},{"q":"Which brackets are used to define a tuple?","options":["Parentheses ()","Square brackets []","Curly braces {}","Angle brackets <>"],"answer":0}],"id":"L3_3","level":3,"levelTitle":"Data Structures","order":3,"title":"Tuples"},{"objective":"Work with unique values and set operations.","why":"You will use sets when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Work with unique values and set operations. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"a = {1, 2, 3, 4}\nb = {3, 4, 5}\nprint(a & b)\nprint(a | b)","code":"a = {1, 2, 3, 4}\nb = {3, 4, 5}\nprint(a & b)\nprint(a | b)","explanation":"Sets store unique values and support intersection, union, difference, and fast membership checks.","mistakes":["Using Sets mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code with default arguments. Try calling the function both with and without the optional parameter.","quiz":[{"q":"What is a special property of a Python set?","options":["Elements are stored in sorted order","Elements can be accessed by index","All elements must be unique (no duplicates)","Sets can only store strings"],"answer":2},{"q":"Which method adds an element to a set?","options":[".append()",".push()",".insert()",".add()"],"answer":3}],"id":"L3_4","level":3,"levelTitle":"Data Structures","order":4,"title":"Sets"},{"objective":"Map keys to values and model structured records.","why":"You will use dictionaries when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Map keys to values and model structured records. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Dictionaries\n\n# Write the smallest working example first.","code":"student = {\"name\": \"Rohith\", \"marks\": 92}\nprint(student[\"name\"])\nstudent[\"passed\"] = True\nprint(student)","explanation":"Dictionaries associate keys with values, making them useful for records and fast lookups by key.","mistakes":["Using Dictionaries mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see local vs global variables. Try changing the local variable inside the function.","quiz":[{"q":"What structure does a Python dictionary store data in?","options":["Indexed items only","Key-value pairs","Ordered numbers","True/False values only"],"answer":1},{"q":"How do you look up the value for the key \"age\" in a dictionary called person?","options":["person(age)","person.index(\"age\")","person[\"age\"]","person{age}"],"answer":2}],"id":"L3_5","level":3,"levelTitle":"Data Structures","order":5,"title":"Dictionaries"},{"objective":"Combine lists and dictionaries for real-world data.","why":"You will use nested collections when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Combine lists and dictionaries for real-world data. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"students = [\n    {\"name\": \"Asha\", \"marks\": [80, 91]},\n    {\"name\": \"Ravi\", \"marks\": [72, 88]},\n]\nfor student in students:\n    print(student[\"name\"], sum(student[\"marks\"]))","code":"students = [\n    {\"name\": \"Asha\", \"marks\": [80, 91]},\n    {\"name\": \"Ravi\", \"marks\": [72, 88]},\n]\nfor student in students:\n    print(student[\"name\"], sum(student[\"marks\"]))","explanation":"Nested collections let you model realistic data such as lists of records containing lists of values. Navigate one layer at a time.","mistakes":["Using Nested Collections mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see *args and **kwargs. Try passing 3 or 4 extra values into the function call.","quiz":[{"q":"What is a nested collection?","options":["A list of dictionaries or dictionary of lists","A variable with two names","An infinite loop","A function inside a comment"],"answer":0},{"q":"Given data = [{\"score\": 90}], how do you get the score?","options":["data[\"score\"][0]","data[0][\"score\"]","data(0)(score)","data.score[0]"],"answer":1}],"id":"L3_6","level":3,"levelTitle":"Data Structures","order":6,"title":"Nested Collections"},{"objective":"Build collections concisely and clearly.","why":"You will use comprehensions when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Build collections concisely and clearly. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Comprehensions\n\n# Write the smallest working example first.","code":"squares = [n * n for n in range(1, 6)]\nevens = [n for n in range(10) if n % 2 == 0]\nprint(squares)\nprint(evens)","explanation":"Comprehensions create collections from an iterable with an optional condition. Prefer them when the expression remains easy to read.","mistakes":["Using Comprehensions mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see docstrings. Try adding a line to print the function docstring with print(function_name.__doc__).","quiz":[{"q":"What is a list comprehension in Python?","options":["A way to delete lists","A tool to compress file size","A sorting algorithm","A concise, elegant syntax to create a new list from an iterable"],"answer":3},{"q":"What does [x * 2 for x in [1, 2, 3]] produce?","options":["[2, 4, 6]","[1, 2, 3]","[1, 4, 9]","[2, 2, 2]"],"answer":0}],"id":"L3_7","level":3,"levelTitle":"Data Structures","order":7,"title":"Comprehensions"},{"objective":"Create a student marks manager using collections.","why":"You will use data structures project when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Create a student marks manager using collections. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"students = {\"Asha\": 88, \"Ravi\": 76, \"Mina\": 94}\nfor name, marks in sorted(students.items(), key=lambda p: p[1], reverse=True):\n    print(name, marks)","code":"students = {\"Asha\": 88, \"Ravi\": 76, \"Mina\": 94}\nfor name, marks in sorted(students.items(), key=lambda p: p[1], reverse=True):\n    print(name, marks)","explanation":"Use a dictionary for student records, then combine iteration and sorting to produce a useful report.","mistakes":["Using Data Structures Project mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the functions project. Try calling the main functions with your own test data.","quiz":[{"q":"Why choose a dictionary over a list for user profiles?","options":["Lists cannot store text","Dictionaries use less memory","Dictionaries allow looking up attributes by descriptive keys like \"email\"","Lists can only hold 10 items"],"answer":2},{"q":"Which method safely retrieves a dictionary value without throwing a KeyError?","options":["dict.find(\"key\")","dict[\"key\"]","dict.search(\"key\")","dict.get(\"key\", default)"],"answer":3}],"id":"L3_8","level":3,"levelTitle":"Data Structures","order":8,"title":"Data Structures Project"},{"objective":"Define reusable functions with parameters and return values.","why":"You will use function basics when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Define reusable functions with parameters and return values. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Function Basics\n\n# Write the smallest working example first.","code":"def area(width, height):\n    return width * height\n\nprint(area(5, 3))","explanation":"A function packages a behavior behind a name. Parameters receive inputs and return sends a result back to the caller.","mistakes":["Using Function Basics mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see list items. Try adding a new item with .append(\"newItem\") and print the updated list.","quiz":[{"q":"Which keyword is used to define a function in Python?","options":["func","def","function","fn"],"answer":1},{"q":"How do you execute (call) a function named greet?","options":["call greet","def greet","greet()","run greet"],"answer":2}],"id":"L4_1","level":4,"levelTitle":"Functions","order":1,"title":"Function Basics"},{"objective":"Use positional, keyword, default, and variadic arguments.","why":"You will use parameters & arguments when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use positional, keyword, default, and variadic arguments. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def greet(name, message=\"Welcome\"):\n    return f\"{message}, {name}!\"\nprint(greet(\"Rohith\"))\nprint(greet(\"Rohith\", message=\"Good evening\"))","code":"def greet(name, message=\"Welcome\"):\n    return f\"{message}, {name}!\"\nprint(greet(\"Rohith\"))\nprint(greet(\"Rohith\", message=\"Good evening\"))","explanation":"Parameters are the function’s interface. Arguments provide actual values. Defaults make optional inputs convenient; keyword arguments make calls clearer.","mistakes":["Using Parameters & Arguments mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the code to see list methods. Try sorting or reversing a list of numbers!","quiz":[{"q":"What is a parameter in a function definition?","options":["A placeholder variable defined in the function signature to accept input","The output of the function","A comment line","The name of the file"],"answer":0},{"q":"In def add(a, b): what are a and b?","options":["Return values","Parameters","Global variables","Keywords"],"answer":1}],"id":"L4_2","level":4,"levelTitle":"Functions","order":2,"title":"Parameters & Arguments"},{"objective":"Design functions that return useful results rather than printing everything.","why":"You will use return values when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Design functions that return useful results rather than printing everything. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Return Values\n\n# Write the smallest working example first.","code":"def is_even(number):\n    return number % 2 == 0\n\nresult = is_even(14)\nprint(result)","explanation":"Returning values keeps a function reusable. The caller decides what to do with the result.","mistakes":["Using Return Values mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the tuple code. Notice that tuples cannot be modified. Try accessing tuple[0] to see the first item.","quiz":[{"q":"Which keyword is used to send a value back from a function to its caller?","options":["send","output","give","return"],"answer":3},{"q":"What does a Python function return by default if there is no return statement?","options":["None","0","False","\"\""],"answer":0}],"id":"L4_3","level":4,"levelTitle":"Functions","order":3,"title":"Return Values"},{"objective":"Understand local, global, and enclosing names.","why":"You will use scope when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand local, global, and enclosing names. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"total = 10\n\ndef demo():\n    total = 25\n    return total\n\nprint(demo())\nprint(total)","code":"total = 10\n\ndef demo():\n    total = 25\n    return total\n\nprint(demo())\nprint(total)","explanation":"A local name can shadow a name outside the function. Prefer passing values in and returning values out instead of relying on global state.","mistakes":["Using Scope mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the dictionary code. Try adding a new key-value pair like user[\"city\"] = \"Tokyo\" and print it.","quiz":[{"q":"Can a variable created inside a function be accessed directly outside of it?","options":["Yes, all variables are global","Only if it is a number","No, it has local scope inside the function","Only in Windows"],"answer":2},{"q":"Which keyword allows modifying a global variable from inside a function?","options":["public","outer","export","global"],"answer":3}],"id":"L4_4","level":4,"levelTitle":"Functions","order":4,"title":"Scope"},{"objective":"Use lambdas, map, filter, and sorted key functions appropriately.","why":"You will use lambda & functional tools when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Use lambdas, map, filter, and sorted key functions appropriately. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"numbers = [5, 2, 9, 1]\nprint(sorted(numbers, key=lambda n: -n))\nprint(list(filter(lambda n: n % 2 == 0, numbers)))","code":"numbers = [5, 2, 9, 1]\nprint(sorted(numbers, key=lambda n: -n))\nprint(list(filter(lambda n: n % 2 == 0, numbers)))","explanation":"Lambdas are small anonymous functions. Use them for short expressions such as sort keys; for complex logic, a named def is clearer.","mistakes":["Using Lambda & Functional Tools mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the dictionary loop. Try printing each key and value using a formatted f-string.","quiz":[{"q":"What is a lambda in Python?","options":["A mathematical constant","A small anonymous function defined on a single line","A built-in module for networking","A loop statement"],"answer":1},{"q":"Which function applies a given function to all items in an iterable?","options":["each()","apply()","map()","loop()"],"answer":2}],"id":"L4_5","level":4,"levelTitle":"Functions","order":5,"title":"Lambda & Functional Tools"},{"objective":"Understand base cases and recursive calls.","why":"You will use recursion when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Understand base cases and recursive calls. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"# Typical pattern\n# Recursion\n\n# Write the smallest working example first.","code":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))","explanation":"Recursion needs a base case and a step that moves toward the base case. Without those, calls never converge.","mistakes":["Using Recursion mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the set example. Notice duplicate numbers are automatically removed! Try adding another duplicate.","quiz":[{"q":"What is recursion in programming?","options":["When a function calls itself to solve smaller subproblems","A loop that cannot stop","A syntax error","Importing two modules together"],"answer":0},{"q":"What is the base case in a recursive function?","options":["The very first line of Python","The condition that stops the recursion from continuing infinitely","The largest number in a list","The print statement"],"answer":1}],"id":"L4_6","level":4,"levelTitle":"Functions","order":6,"title":"Recursion"},{"objective":"Write small, testable, single-purpose functions.","why":"You will use function design when writing real Python. Learning it now makes later topics easier to reason about.","concept":"Write small, testable, single-purpose functions. Focus on understanding why the feature works, not only memorizing syntax.","syntax":"def normalize_name(text):\n    return \" \".join(text.strip().title().split())\n\nprint(normalize_name(\"  rohith   kumar \"))","code":"def normalize_name(text):\n    return \" \".join(text.strip().title().split())\n\nprint(normalize_name(\"  rohith   kumar \"))","explanation":"Good functions have one clear responsibility, explicit inputs, useful outputs, and predictable behavior. They are easier to test and reuse.","mistakes":["Using Function Design mechanically without checking the data types involved.","Trying to solve the entire problem in one large block instead of testing small pieces.","Ignoring the exact error message and guessing at the cause."],"practice":"Run the nested data structure code. Try accessing one of the nested values and printing it.","quiz":[{"q":"What is the Single Responsibility Principle for functions?","options":["Every file can only have one function","A function can only take one parameter","A function must never return a value","A function should focus on doing one clear task well"],"answer":3},{"q":"Where should a docstring be placed in a function
